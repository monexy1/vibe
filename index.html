<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vibe</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

:root {
    --bg: #0b1020;
    --panel: #151b2f;
    --panel2: #202943;
    --text: #ffffff;
    --muted: #9aa5c1;
    --accent: #8b5cf6;
    --accent2: #6d28d9;
    --bubble: #293352;
    --border: rgba(255,255,255,.08);
    --mine-shadow: 0 7px 20px rgba(139,92,246,.22);
}

body.light {
    --bg: #eef2ff;
    --panel: #ffffff;
    --panel2: #f1f5f9;
    --text: #111827;
    --muted: #64748b;
    --accent: #6366f1;
    --accent2: #4f46e5;
    --bubble: #e2e8f0;
    --border: rgba(0,0,0,.08);
    --mine-shadow: 0 7px 20px rgba(79,70,229,.18);
}

body.ocean {
    --bg: #071923;
    --panel: #0d2835;
    --panel2: #123b4d;
    --text: #ffffff;
    --muted: #91b7c7;
    --accent: #06b6d4;
    --accent2: #0891b2;
    --bubble: #16465a;
    --border: rgba(255,255,255,.08);
    --mine-shadow: 0 7px 20px rgba(6,182,212,.22);
}

body.sunset {
    --bg: #24120f;
    --panel: #351a18;
    --panel2: #54231e;
    --text: #ffffff;
    --muted: #d5aaa3;
    --accent: #f97316;
    --accent2: #ea580c;
    --bubble: #633129;
    --border: rgba(255,255,255,.08);
    --mine-shadow: 0 7px 20px rgba(249,115,22,.22);
}

body {
    background: var(--bg);
    color: var(--text);
}

body.booting > #authScreen,
body.booting > #app {
    display: none !important;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* AUTH */

.auth {
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 430px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 30px;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
}

.logo {
    font-size: 40px;
    font-weight: 900;
    text-align: center;
    letter-spacing: -.5px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin: 6px 0 22px;
}

.language-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.language-row select {
    flex: 1;
}

.auth input,
.auth select {
    width: 100%;
    margin-bottom: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,92,246,.12);
}

.primary {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 14px;
    color: white;
    background: var(--accent);
    font-weight: 700;
    transition: .18s;
}

.primary:hover {
    background: var(--accent2);
    transform: translateY(-1px);
}

.secondary {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 13px;
    color: var(--text);
    background: var(--panel2);
}

.auth-message {
    min-height: 22px;
    margin-top: 12px;
    text-align: center;
    color: #f87171;
}

/* APP */

.app {
    width: 100%;
    height: 100dvh;
}

.layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 320px minmax(0,1fr);
}

.sidebar {
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
}

.side-top {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin-bottom: 14px;
}

.brand {
    font-size: 27px;
    font-weight: 900;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    transition: .18s;
}

.icon-btn:hover {
    background: var(--accent);
    color: white;
}

.search {
    position: relative;
    margin-bottom: 10px;
}

.search input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.results {
    max-height: 190px;
    overflow-y: auto;
    margin-bottom: 8px;
}

.friends {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
}

.person {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 14px;
    cursor: pointer;
    background: transparent;
    transition: .15s;
}

.person:hover,
.person.active {
    background: var(--panel2);
}

.avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-weight: 700;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.person-info {
    min-width: 0;
    flex: 1;
}

.person-name {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.person-login {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat-count {
    min-width: 26px;
    height: 26px;
    padding: 0 7px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: 700;
}

.channel-sidebar-icon {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 13px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 21px;
    overflow: hidden;
}

.channel-sidebar-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bottom-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.bottom-buttons button {
    padding: 11px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    transition: .15s;
}

.bottom-buttons button:hover {
    background: var(--accent);
    color: white;
}

/* CHAT */

.chat {
    min-width: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
}

.chat-head {
    flex-shrink: 0;
    min-height: 74px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.chat-user {
    min-width: 0;
    flex: 1;
    cursor: pointer;
}

.chat-name {
    font-weight: 800;
    font-size: 16px;
}

.chat-status {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.call-buttons {
    display: flex;
    gap: 7px;
}

.call-buttons button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.mobile-back-btn {
    display: none;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    font-size: 20px;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    -webkit-overflow-scrolling: touch;
}

.empty-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
}

.message-row {
    display: flex;
    margin-bottom: 10px;
}

.message-row.mine {
    justify-content: flex-end;
}

.message {
    max-width: min(70%,650px);
    padding: 10px 13px;
    border-radius: 17px;
    background: var(--bubble);
    word-break: break-word;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.message.mine {
    background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    color: white;
    border-bottom-right-radius: 5px;
    box-shadow: var(--mine-shadow);
}

.message:not(.mine) {
    border-bottom-left-radius: 5px;
}

.message-time {
    font-size: 10px;
    opacity: .65;
    margin-top: 5px;
    text-align: right;
}

/* COMPOSER */

.composer {
    position: relative;
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.composer input {
    min-width: 0;
    flex: 1;
    padding: 13px;
    border-radius: 13px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.composer button {
    width: 48px;
    border: 0;
    border-radius: 13px;
    background: var(--accent);
    color: white;
}

.emoji-btn {
    width: 48px !important;
    background: var(--panel2) !important;
    color: var(--text) !important;
    font-size: 20px;
}

/* EMOJI */

.emoji-picker {
    position: absolute;
    right: 70px;
    bottom: 65px;
    width: 300px;
    max-height: 250px;
    overflow-y: auto;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
    z-index: 20;
}

.emoji-grid {
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap: 5px;
}

.emoji-item {
    border: 0;
    background: transparent;
    color: var(--text);
    font-size: 23px;
    border-radius: 8px;
    padding: 5px;
}

.emoji-item:hover {
    background: var(--panel2);
}

/* CHANNEL */

.channel-post {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.channel-post-author {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 11px;
}

.channel-post-author .avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    font-size: 13px;
}

.channel-post-author-name {
    font-weight: 800;
    font-size: 13px;
}

.channel-post-text {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
    margin-bottom: 9px;
}

.channel-post img,
.channel-post video {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 13px;
    background: #000;
}

.channel-post-time {
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
}

/* MODALS */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.68);
    backdrop-filter: blur(4px);
}

.modal-card {
    width: 100%;
    max-width: 520px;
    max-height: 90dvh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 25px 70px rgba(0,0,0,.4);
}

.modal-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
}

.modal input,
.modal textarea,
.modal select {
    width: 100%;
    margin-bottom: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.modal textarea {
    min-height: 90px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.modal-actions button {
    flex: 1;
    padding: 11px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.modal-actions .primary {
    background: var(--accent);
}

.setting-section {
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 15px;
    background: var(--panel2);
}

.setting-title {
    font-weight: 800;
    margin-bottom: 10px;
}

.setting-label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.profile-photo {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: var(--accent);
    overflow: hidden;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.channels-list {
    max-height: 55vh;
    overflow-y: auto;
}

.channel-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 7px;
    border-radius: 14px;
    background: var(--panel2);
}

.channel-item-main {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
}

.channel-icon {
    width: 45px;
    height: 45px;
    min-width: 45px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    font-size: 20px;
    overflow: hidden;
}

.channel-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.channel-info {
    min-width: 0;
    flex: 1;
}

.channel-name {
    font-weight: 800;
}

.channel-description {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.channel-action {
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    background: var(--accent);
    color: white;
    font-size: 12px;
}

.channel-action.subscribed {
    background: var(--panel);
}

/* CALL */

.call-screen {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(4,7,15,.97);
    display: flex;
    flex-direction: column;
}

.call-top {
    padding: 25px 20px 10px;
    text-align: center;
    color: white;
}

.call-profile-photo {
    width: 86px;
    height: 86px;
    margin: 0 auto 12px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.call-profile-photo img,
.incoming-profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.call-name {
    font-size: 24px;
    font-weight: 800;
}

.call-status {
    margin-top: 6px;
    color: #aeb8d0;
    font-size: 14px;
}

.call-video {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

#remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#localVideo {
    position: absolute;
    right: 15px;
    bottom: 15px;
    width: 150px;
    max-height: 220px;
    border-radius: 15px;
    object-fit: cover;
    background: #111;
    border: 2px solid rgba(255,255,255,.15);
}

.call-controls {
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

.call-controls button {
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 50%;
    background: #26304a;
    color: white;
    font-size: 19px;
}

.call-controls .end-call {
    background: #dc2626;
    width: 64px;
    height: 64px;
}

.incoming-card {
    text-align: center;
}

.incoming-profile-photo {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 30px;
}

.incoming-buttons {
    display: flex;
    gap: 10px;
}

.incoming-buttons button {
    flex: 1;
}

/* VIBE POLISH */
.brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-shadow:0 0 18px rgba(236,72,153,.45), 0 0 30px rgba(139,92,246,.4);
}
.brand::before {
    content:"V";
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#fff;
    font-size:20px;
    font-weight:900;
    box-shadow:0 0 12px rgba(236,72,153,.55),0 0 24px rgba(139,92,246,.4);
}

.file-upload-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:12px;
    margin:0 0 12px;
    border-radius:13px;
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
    cursor:pointer;
}
.file-upload-btn:hover {
    border-color:var(--accent);
    background:var(--panel2);
}

/* MOBILE */

@media (max-width:750px) {

    html,
    body {
        height: 100%;
        overflow: hidden;
    }

    .layout {
        position: relative;
        display: block;
        width: 100%;
        height: 100dvh;
    }

    .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100dvh;
        border-right: 0;
        padding:
            max(10px,env(safe-area-inset-top))
            10px
            max(8px,env(safe-area-inset-bottom))
            10px;
        z-index: 2;
    }

    .chat {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100dvh;
        display: none;
        z-index: 3;
    }

    .app.mobile-chat-open .sidebar {
        display: none;
    }

    .app.mobile-chat-open .chat {
        display: flex;
    }

    .mobile-back-btn {
        display: block;
        flex-shrink: 0;
    }

    .chat-head {
        min-height: 64px;
        padding: 8px 9px;
    }

    .messages {
        padding: 12px 10px;
    }

    .message {
        max-width: 84%;
    }

    .composer {
        padding: 8px;
    }

    .composer input {
        font-size: 16px;
    }

    .composer button {
        width: 46px;
        min-width: 46px;
    }

    .emoji-picker {
        right: 60px;
        bottom: 62px;
        width: calc(100vw - 75px);
    }

    .bottom-buttons {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
    }

    .bottom-buttons button {
        min-height: 44px;
        padding: 9px 5px;
        font-size: 12px;
    }

    .modal {
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
    }

    .modal-card {
        width:100%;
        max-width:none;
        height:100dvh;
        max-height:none;
        overflow-y:auto;
        border-radius:0;
        padding:20px 14px calc(20px + env(safe-area-inset-bottom));
    }

    #settingsModal .modal-card {
        padding-top:max(20px, env(safe-area-inset-top));
    }

    .modal-card {
        max-height: 92dvh;
        border-radius: 18px;
        padding: 17px;
    }

    #localVideo {
        width: 110px;
        max-height: 170px;
    }
}

</style>

</head>

<body class="booting">


<!-- AUTH -->

<div id="authScreen" class="auth hidden">

    <div class="auth-card">

        <div class="logo">Vibe</div>

        <div id="authSubtitle" class="subtitle">
            Твой новый мессенджер
        </div>

        <div class="language-row">

            <select id="authLanguage" onchange="changeAuthLanguage()">

                <option value="ru">
                    🇷🇺 Русский
                </option>

                <option value="en">
                    🇬🇧 English
                </option>

            </select>

        </div>

        <input
            id="loginInput"
            type="text"
            placeholder="Введите логин"
            autocomplete="username"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
        >

        <button
            id="loginButton"

<script>

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentChat = "";

let friends = [];
let chats = [];
let channels = [];

let currentPhoto = "";
let currentChannel = null;

let socket = null;

let peerConnection = null;
let localStream = null;

let incomingCall = null;

let activeCallUser = "";
let activeCallVideo = false;

let microphoneEnabled = true;
let cameraEnabled = true;

let chatTimer = null;
let callTimer = null;
let callSeconds = 0;

let profileViewLogin = "";


/* =========================================================
   TRANSLATIONS
========================================================= */

const translations = {

    ru: {
        subtitle: "Твой новый мессенджер",
        login: "Войти",
        register: "Создать аккаунт",
        loginPlaceholder: "Введите логин",
        passwordPlaceholder: "Введите пароль",
        search: "Поиск людей...",
        write: "Написать сообщение...",
        settings: "Настройки",
        channels: "Каналы",
        logout: "Выйти",
        profile: "Профиль"
    },

    en: {
        subtitle: "Your new messenger",
        login: "Log in",
        register: "Create account",
        loginPlaceholder: "Enter username",
        passwordPlaceholder: "Enter password",
        search: "Search people...",
        write: "Write a message...",
        settings: "Settings",
        channels: "Channels",
        logout: "Log out",
        profile: "Profile"
    }

};


let siteLanguage =
    localStorage.getItem("vibeLanguage") ||
    "ru";


function applyLanguage() {

    const t =
        translations[siteLanguage] ||
        translations.ru;

    document.documentElement.lang =
        siteLanguage;

    $("authSubtitle").textContent =
        t.subtitle;

    $("loginButton").textContent =
        t.login;

    $("registerButton").textContent =
        t.register;

    $("loginInput").placeholder =
        t.loginPlaceholder;

    $("passwordInput").placeholder =
        t.passwordPlaceholder;

    $("searchInput").placeholder =
        t.search;

    if (!currentChannel) {

        $("messageInput").placeholder =
            t.write;
    }

    $("siteLanguage").value =
        siteLanguage;

    $("authLanguage").value =
        siteLanguage;

    $("registerLanguage").value =
        siteLanguage;
}


function changeAuthLanguage() {

    siteLanguage =
        $("authLanguage").value;

    localStorage.setItem(
        "vibeLanguage",
        siteLanguage
    );

    applyLanguage();
}


function changeSiteLanguage() {

    siteLanguage =
        $("siteLanguage").value;

    localStorage.setItem(
        "vibeLanguage",
        siteLanguage
    );

    applyLanguage();
}


/* =========================================================
   EXTRA PROFILE DATA
   Пока хранится локально.
========================================================= */

function extraKey(login) {
    return "vibeExtraProfile_" + login;
}


function getExtraProfile(login) {

    try {

        return JSON.parse(
            localStorage.getItem(
                extraKey(login)
            )
        ) || {};

    } catch {

        return {};
    }
}


function saveExtraProfile(login,data) {

    localStorage.setItem(
        extraKey(login),
        JSON.stringify(data)
    );
}


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme) {

    document.body.classList.remove(
        "light",
        "ocean",
        "sunset"
    );

    if (
        theme &&
        theme !== "dark"
    ) {

        document.body.classList.add(
            theme
        );
    }

    localStorage.setItem(
        "vibeTheme",
        theme || "dark"
    );

    if ($("siteTheme")) {
        $("siteTheme").value =
            theme || "dark";
    }
}


function changeTheme() {

    applyTheme(
        $("siteTheme").value
    );
}


/* =========================================================
   EMOJI
========================================================= */

const emojis = [
    "😀","😃","😄","😁","😆","😅","😂","🤣",
    "😊","😇","🙂","🙃","😉","😌","😍","🥰",
    "😘","😎","🤩","🥳","😏","😮","😯","😲",
    "😳","🥺","😢","😭","😡","🤬","🤔","🫡",
    "👍","👎","👏","🙌","🔥","❤️","💜","💙",
    "💚","💛","🖤","🤍","✨","⭐","🎉","🎊",
    "💯","😂","🤣","😈","👀","💀","🤝","🙏"
];


function initEmojiPicker() {

    const grid =
        $("emojiGrid");

    grid.innerHTML = "";

    emojis.forEach(
        emoji => {

            const button =
                document.createElement("button");

            button.className =
                "emoji-item";

            button.textContent =
                emoji;

            button.onclick =
                () => {

                    const input =
                        $("messageInput");

                    if (input.disabled) {
                        return;
                    }

                    const start =
                        input.selectionStart ??
                        input.value.length;

                    const end =
                        input.selectionEnd ??
                        input.value.length;

                    input.value =
                        input.value.slice(0,start) +
                        emoji +
                        input.value.slice(end);

                    input.focus();

                    input.selectionStart =
                        input.selectionEnd =
                        start + emoji.length;
                };

            grid.appendChild(button);
        }
    );
}


function toggleEmojiPicker() {

    $("emojiPicker")
        .classList
        .toggle("hidden");
}


document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(".emoji-picker") &&
            !event.target.closest(".emoji-btn")
        ) {

            $("emojiPicker")
                ?.classList
                .add("hidden");
        }
    }
);


/* =========================================================
   READ COUNTS
========================================================= */

let readMessageCounts = {};

try {

    readMessageCounts =
        JSON.parse(
            localStorage.getItem(
                "vibeReadCounts"
            )
        ) || {};

} catch {

    readMessageCounts = {};
}


function saveReadMessageCounts() {

    localStorage.setItem(
        "vibeReadCounts",
        JSON.stringify(
            readMessageCounts
        )
    );
}


let readChannelCounts = {};

try {

    readChannelCounts =
        JSON.parse(
            localStorage.getItem(
                "vibeChannelReadCounts"
            )
        ) || {};

} catch {

    readChannelCounts = {};
}


function saveReadChannelCounts() {

    localStorage.setItem(
        "vibeChannelReadCounts",
        JSON.stringify(
            readChannelCounts
        )
    );
}


/* =========================================================
   MOBILE
========================================================= */

function isMobileView() {

    return window.matchMedia(
        "(max-width:750px)"
    ).matches;
}


function openMobileChatView() {

    if (!isMobileView()) {
        return;
    }

    $("app")
        .classList
        .add("mobile-chat-open");
}


function closeMobileChat() {

    $("app")
        .classList
        .remove("mobile-chat-open");

    if (chatTimer) {

        clearInterval(chatTimer);

        chatTimer = null;
    }
}


window.addEventListener(
    "resize",
    () => {

        if (!isMobileView()) {

            $("app")
                .classList
                .remove("mobile-chat-open");
        }
    }
);


/* =========================================================
   AUTH
========================================================= */

function openRegister() {

    $("registerMessage").textContent = "";

    $("registerLogin").value =
        $("loginInput").value.trim();

    $("registerPassword").value =
        $("passwordInput").value;

    $("registerName").value = "";

    $("registerBirthDate").value = "";

    $("registerEmail").value = "";

    $("registerModal")
        .classList
        .remove("hidden");
}


async function login() {

    const loginValue =
        $("loginInput")
            .value
            .trim();

    const password =
        $("passwordInput")
            .value
            .trim();

    if (!loginValue || !password) {

        $("authMessage").textContent =
            siteLanguage === "ru"
                ? "Заполни все поля"
                : "Fill in all fields";

        return;
    }

    try {

        const response =
            await fetch(
                "/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            login:loginValue,
                            password
                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            $("authMessage").textContent =
                data.message;

            return;
        }

        currentUser =
            data.user;

        localStorage.setItem(
            "vibeLogin",
            currentUser.login
        );

        localStorage.setItem(
            "vibeUser",
            JSON.stringify(currentUser)
        );

        const extra =
            getExtraProfile(
                currentUser.login
            );

        if (extra.language) {

            siteLanguage =
                extra.language;

            localStorage.setItem(
                "vibeLanguage",
                siteLanguage
            );
        }

        if (extra.theme) {
            applyTheme(extra.theme);
        }

        $("passwordInput").value = "";

        showApp();

    } catch {

        $("authMessage").textContent =
            siteLanguage === "ru"
                ? "Сервер не отвечает"
                : "Server is not responding";
    }
}


async function register() {

    const loginValue =
        $("registerLogin")
            .value
            .trim();

    const password =
        $("registerPassword")
            .value
            .trim();

    const name =
        $("registerName")
            .value
            .trim();

    const birthDate =
        $("registerBirthDate")
            .value;

    const email =
        $("registerEmail")
            .value
            .trim();

    const language =
        $("registerLanguage")
            .value;

    if (
        !loginValue ||
        !password ||
        !name ||
        !birthDate
    ) {

        $("registerMessage").textContent =
            language === "ru"
                ? "Заполни логин, пароль, имя и дату рождения"
                : "Fill in username, password, name and birth date";

        return;
    }

    try {

        const response =
            await fetch(
                "/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            login:loginValue,
                            password
                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            $("registerMessage").textContent =
                data.message;

            return;
        }

        currentUser =
            data.user;

        /*
            Сервер пока принимает только
            login/password.

            Остальные данные сохраняем
            локально до обновления server.js.
        */

        saveExtraProfile(

/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket() {

    if (!currentUser) {
        return;
    }

    if (
        socket &&
        (
            socket.readyState === 0 ||
            socket.readyState === 1
        )
    ) {
        return;
    }

    try {

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";

        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host
            );

        socket.onopen = () => {

            socket.send(
                JSON.stringify({
                    type:"auth",
                    login:
                        currentUser.login
                })
            );
        };

        socket.onmessage =
            event => {

                try {

                    handleSocketMessage(
                        JSON.parse(
                            event.data
                        )
                    );

                } catch {}
            };

        socket.onclose = () => {

            socket = null;

            if (currentUser) {

                setTimeout(
                    () => {

                        if (
                            currentUser &&
                            !socket
                        ) {
                            connectSocket();
                        }

                    },
                    3000
                );
            }
        };

    } catch {}
}


function sendSocket(data) {

    if (
        socket &&
        socket.readyState === 1
    ) {

        socket.send(
            JSON.stringify(data)
        );
    }
}


function handleSocketMessage(data) {

    if (
        data.type === "new-message"
    ) {

        if (
            currentChat &&
            !currentChannel &&
            data.message &&
            data.message.from ===
                currentChat
        ) {

            loadMessages(false);

            markChatAsRead(
                currentChat
            );

        } else {

            loadChats();
        }

        return;
    }


    if (
        data.type === "new-channel-post"
    ) {

        if (
            currentChannel &&
            data.channelId ===
                currentChannel.id
        ) {

            loadChannelPosts(false);

            markChannelAsRead(
                currentChannel.id
            );

        } else {

            loadChannels();
        }

        return;
    }


    if (
        data.type === "incoming-call"
    ) {

        incomingCall = data;

        $("incomingCallText")
            .textContent =
            (
                data.name ||
                data.from
            ) +
            (
                siteLanguage === "ru"
                    ? " звонит вам"
                    : " is calling you"
            );

        $("incomingCallPhoto")
            .innerHTML =
            data.photo
                ? `<img src="${escapeHTML(data.photo)}">`
                : "👤";

        $("incomingCallModal")
            .classList
            .remove("hidden");

        return;
    }


    if (data.type === "answer") {

        handleAnswer(
            data.answer
        );

        return;
    }


    if (data.type === "ice-candidate") {

        if (
            peerConnection &&
            data.candidate
        ) {

            peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                )
                .catch(() => {});
        }

        return;
    }


    if (data.type === "call-rejected") {

        endCallUI();

        alert(
            data.reason ||
            "Звонок отклонён"
        );

        return;
    }


    if (data.type === "hangup") {

        endCallUI();

        return;
    }
}

function getUnreadCount(chat) {

    const total =
        Number(
            chat.messageCount || 0
        );

    const read =
        Number(
            readMessageCounts[
                chat.login
            ] || 0
        );

    return Math.max(
        0,
        total - read
    );
}


function getChannelUnreadCount(channel) {

    const total =
        Number(
            channel.postCount || 0
        );

    const read =
        Number(
            readChannelCounts[
                channel.id
            ] || 0
        );

    return Math.max(
        0,
        total - read
    );
}


function renderChats() {

    const box =
        $("friends");

    box.innerHTML = "";

    const subscribedChannels =
        channels.filter(
            channel =>
                channel.subscribed
        );

    const items = [];

    chats.forEach(
        chat => {

            items.push({
                type:"chat",
                data:chat,
                time:
                    chat.lastTime || ""
            });
        }
    );

    subscribedChannels.forEach(
        channel => {

            items.push({
                type:"channel",
                data:channel,
                time:
                    channel.lastTime || ""
            });
        }
    );

    items.sort(
        (a,b) =>
            new Date(
                b.time || 0
            ) -
            new Date(
                a.time || 0
            )
    );

    if (!items.length) {

        if (friends.length) {

            friends.forEach(
                user => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "person";

                    item.innerHTML =
                        personHTML(user);

                    item.onclick =
                        () =>
                            openChat(
                                user.login
                            );

                    box.appendChild(item);
                }
            );

            return;
        }

        box.innerHTML =
            `
            <div style="
                color:var(--muted);
                padding:15px;
                text-align:center;
            ">
                Пока нет переписок
            </div>
            `;

        return;
    }

    items.forEach(
        itemData => {

            if (
                itemData.type === "chat"
            ) {

                const chat =
                    itemData.data;

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "person";

                if (
                    chat.login ===
                    currentChat &&
                    !currentChannel
                ) {

                    item.classList.add(
                        "active"
                    );
                }

                item.innerHTML =
                    personHTML(
                        chat.user,
                        getUnreadCount(chat)
                    );

                item.onclick =
                    () =>
                        openChat(
                            chat.login
                        );

                box.appendChild(item);

                return;
            }

            const channel =
                itemData.data;

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "person";

            const icon =
                channel.photo
                    ? `<img src="${escapeHTML(channel.photo)}">`
                    : "📢";

            const unread =
                getChannelUnreadCount(
                    channel
                );

            item.innerHTML =
                `
                <div class="channel-sidebar-icon">
                    ${icon}
                </div>

                <div class="person-info">

                    <div class="person-name">
                        ${escapeHTML(
                            channel.name
                        )}
                    </div>

                    <div class="person-login">
                        Канал
                    </div>

                </div>

                ${
                    unread > 0
                        ? `
                            <div class="chat-count">
                                ${unread}
                            </div>
                          `
                        : ""
                }
                `;

            item.onclick =
                () =>
                    openChannel(channel);

            box.appendChild(item);
        }
    );
}

/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages(forceScroll=false) {

    if (
        !currentChat ||
        !currentUser ||
        currentChannel
    ) {
        return;
    }

    const box =
        $("messages");

    const wasNearBottom =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        100;

    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser.login
                ) +
                "&user2=" +
                encodeURIComponent(
                    currentChat
                )
            );

        if (!response.ok) {
            return;
        }

        const messages =
            await response.json();

        box.innerHTML = "";

        if (!messages.length) {

            box.innerHTML =
                `
                <div class="empty-chat">
                    ${
                        siteLanguage === "ru"
                            ? "Пока сообщений нет.<br>Напишите первым!"
                            : "No messages yet.<br>Send the first message!"
                    }
                </div>
                `;

            return;
        }

        messages.forEach(
            message => {

                const row =
                    document.createElement(
                        "div"
                    );

                const mine =
                    message.from ===
                    currentUser.login;

                row.className =
                    "message-row" +
                    (
                        mine
                            ? " mine"
                            : ""
                    );

                const bubble =
                    document.createElement(
                        "div"
                    );

                bubble.className =
                    "message" +
                    (
                        mine
                            ? " mine"
                            : ""
                    );

                const time =
                    new Date(
                        message.time
                    ).toLocaleTimeString(
                        [],
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    );

                bubble.innerHTML =
                    `
                    <div>
                        ${escapeHTML(
                            message.text
                        )}
                    </div>

                    <div class="message-time">
                        ${time}
                    </div>
                    `;

                row.appendChild(bubble);

                box.appendChild(row);
            }
        );

        if (
            forceScroll ||
            wasNearBottom
        ) {

            box.scrollTop =
                box.scrollHeight;
        }

    } catch {}
}

async function sendMessage() {

    if (currentChannel) {

        await publishChannelPostFromComposer();

        return;

    const input =
        $("messageInput");

        input.value.trim();

    if (
        !text ||
        !currentChat ||
        !currentUser
    ) {

    }

    input.value = "";

    try {

        const response =
            await fetch(
                "/send-message",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            from:
                                currentUser.login,

                            to:
                                currentChat,

                            text
                        })
                }
            );

        const data =
            await response.json();

        if (data.success) {

            await loadMessages(true);

            await loadChats();

            await markChatAsRead(
                currentChat
            );
        }

    } catch {}
}

async function openUserProfile(login) {

    const user =
        await getUser(login);

    if (!user) {
        return;
    }

    profileViewLogin =
        login;

    const own =
        login === currentUser.login;

    const extra =
        getExtraProfile(login);

    $("profileModalTitle")
        .textContent =
        own
            ? "Мой профиль"
            : "Профиль пользователя";

    $("profileName").value =
        user.name || "";

    $("profileAbout").value =
        user.about || "";

    $("profilePhoto").value =
        user.photo || "";

    if ($("profilePhotoFile")) {
        $("profilePhotoFile").value = "";
    }

    $("messageStyle").value =
        user.messageStyle ||
        "classic";

    /*
        Email всегда скрыт от других.
    */

    $("profileEmail").value =
        own
            ? (extra.email || "")
            : "";

    /*
        День рождения показываем
        только если это разрешено.
    */

    let canSeeBirthDate = own;

    if (!own) {

        canSeeBirthDate =
            extra.privacyBirthDate ===
            "everyone";

        if (
            extra.privacyBirthDate ===
            "friends"
        ) {

            canSeeBirthDate =
                friends.some(
                    friend =>
                        friend.login === login
                );
        }
    }

    $("profileBirthDate").value =
        canSeeBirthDate
            ? (extra.birthDate || "")
            : "";

    $("profileName").disabled = !own;
    $("profileAbout").disabled = !own;
    $("profilePhoto").disabled = !own;
    $("messageStyle").disabled = !own;
    $("profileBirthDate").disabled = !own;
    $("profileEmail").disabled = !own;

    $("profilePrivacy")
        .classList
        .toggle(
            "hidden",
            !own
        );

    $("profileButtons")
        .classList
        .toggle(
            "hidden",
            !own
        );

    currentPhoto =
        user.photo || "";

    updateProfilePreview();

    $("profileModal")
        .classList
        .remove("hidden");
}


function updateProfilePreview() {

    $("profilePreview")
        .innerHTML =
        currentPhoto
            ? `<img src="${escapeHTML(currentPhoto)}">`
            : "👤";
}


$("profilePhoto")
    .addEventListener(
        "input",
        event => {

            currentPhoto =
                event.target.value.trim();

            updateProfilePreview();
        }
    );

$("profilePhotoFile")
    .addEventListener(
        "change",
        event => {

            const file = event.target.files?.[0];

            if (!file || !file.type.startsWith("image/")) {
                return;
            }

            const reader = new FileReader();

            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const max = 700;
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const canvas = document.createElement("canvas");
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentPhoto = canvas.toDataURL("image/jpeg", 0.82);
                    $("profilePhoto").value = currentPhoto;
                    updateProfilePreview();
                };
                img.src = reader.result;
            };

            reader.readAsDataURL(file);
        }
    );

async function loadChannelPosts(forceScroll=true) {

    if (!currentChannel) {
        return;
    }

    try {

        const response =
            await fetch(
                "/channel-posts?channelId=" +
                encodeURIComponent(
                    currentChannel.id
                )
            );

        if (!response.ok) {
            return;
        }

        const posts =
            await response.json();

        const box =
            $("messages");

        const wasNearBottom =
            box.scrollHeight -
            box.scrollTop -
            box.clientHeight <
            100;

        box.innerHTML = "";

        /*
            Название канала остаётся сверху
            даже если публикаций пока нет.
        */

        const channelBanner =
            document.createElement("div");

        channelBanner.style.cssText =
            `
            padding:12px 14px;
            margin-bottom:14px;
            border-radius:15px;
            background:var(--panel);
            border:1px solid var(--border);
            font-weight:800;
            `;

        channelBanner.innerHTML =
            `
            📢 ${escapeHTML(
                currentChannel.name
            )}
            `;

        box.appendChild(
            channelBanner
        );

        if (!posts.length) {

            const empty =
                document.createElement("div");

            empty.className =
                "empty-chat";

            empty.style.height =
                "calc(100% - 65px)";

            empty.innerHTML =
                `
                В канале пока нет публикаций
                `;

            box.appendChild(empty);

            return;
        }

        posts.forEach(
            post => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "channel-post";

                const author =
                    post.authorUser ||
                    {
                        login:
                            post.author,

                        name:
                            post.author,

                        photo:""
                    };

                const avatar =
                    author.photo
                        ? `<img src="${escapeHTML(author.photo)}">`
                        : "👤";

                let mediaHTML = "";

                if (post.media) {

                    if (
                        post.mediaType &&
                        post.mediaType.startsWith(
                            "image"
                        )
                    ) {

                        mediaHTML =
                            `
                            <img
                                src="${escapeHTML(
                                    post.media
                                )}"
                            >
                            `;

                    } else if (
                        post.mediaType &&
                        post.mediaType.startsWith(
                            "video"
                        )
                    ) {

                        mediaHTML =
                            `
                            <video
                                src="${escapeHTML(
                                    post.media
                                )}"
                                controls
                                playsinline
                            ></video>
                            `;
                    }
                }

                item.innerHTML =
                    `
                    <div class="channel-post-author">

                        <div class="avatar">
                            ${avatar}
                        </div>

                        <div class="channel-post-author-name">
                            ${escapeHTML(
                                author.name ||
                                author.login
                            )}
                        </div>

                    </div>

                    ${
                        post.text
                            ? `
                                <div class="channel-post-text">
                                    ${escapeHTML(
                                        post.text
                                    )}
                                </div>
                              `
                            : ""
                    }

                    ${mediaHTML}

                    <div class="channel-post-time">
                        ${new Date(
                            post.time
                        ).toLocaleString()}
                    </div>
                    `;

                box.appendChild(item);
            }
        );

        if (
            forceScroll ||
            wasNearBottom
        ) {

            box.scrollTop =
                box.scrollHeight;
        }

    } catch {}
}

/* =========================================================
   CALLS
========================================================= */

const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        }

    ]
};


async function startCall(video) {

    if (
        !currentChat ||
        currentChannel
    ) {

        alert(
            "Сначала откройте обычный чат"
        );

        return;
    }

    if (peerConnection) {

        alert(
            "Звонок уже идёт"
        );

        return;
    }

    activeCallUser =
        currentChat;

    activeCallVideo =
        video;

    const user =
        await getUser(
            activeCallUser
        );

    try {

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true,
                    video
                });

        microphoneEnabled = true;
        cameraEnabled = true;

        peerConnection =
            createPeerConnection();

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );

        const offer =
            await peerConnection
                .createOffer();

        await peerConnection
            .setLocalDescription(
                offer
            );

        sendSocket({

            type:"call",

            to:
                activeCallUser,

            video,

            offer:
                peerConnection
                    .localDescription,

            name:
                currentUser.name ||
                currentUser.login,

            photo:
                currentUser.photo ||
                ""
        });

        showCallUI(user);

    } catch {

        endCallUI();

        alert(
            "Не удалось начать звонок"
        );
    }
}


function createPeerConnection() {

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    pc.onicecandidate =
        event => {

            if (event.candidate) {

                sendSocket({

                    type:
                        "ice-candidate",

                    to:
                        activeCallUser,

                    candidate:
                        event.candidate
                });
            }
        };

    pc.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {

                $("remoteVideo")
                    .srcObject =
                    event.streams[0];

                $("callStatus")
                    .textContent =
                    "Соединение установлено";

                startCallTimer();
            }
        };

    pc.onconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }

            const state =
                peerConnection
                    .connectionState;

            if (state === "connected") {

                $("callStatus")
                    .textContent =
                    "Соединение установлено";

                startCallTimer();

            } else if (state === "connecting") {

                $("callStatus")
                    .textContent =
                    "Соединение...";

            } else if (state === "disconnected") {

                $("callStatus")
                    .textContent =
                    "Соединение прервано";

            } else if (state === "failed") {

                $("callStatus")
                    .textContent =
                    "Ошибка соединения";
            }
        };

    return pc;
}


function showCallUI(user=null) {

    $("callName")
        .textContent =
        user
            ? (
                user.name ||
                user.login
            )
            : activeCallUser;

    $("callProfilePhoto")
        .innerHTML =
        user && user.photo
            ? `<img src="${escapeHTML(user.photo)}">`
            : "👤";

    $("callStatus")
        .textContent =
        "Ожидание соединения...";

    $("callScreen")
        .classList
        .remove("hidden");

    if (localStream) {

        $("localVideo")
            .srcObject =
            localStream;
    }

    $("localVideo").style.display =
        activeCallVideo
            ? "block"
            : "none";

    $("remoteVideo").style.display =
        activeCallVideo
            ? "block"
            : "none";

    $("micButton").textContent =
        "🎙️";

    $("cameraButton").textContent =
        activeCallVideo
            ? "📷"
            : "🚫";

    callSeconds = 0;

    if (callTimer) {

        clearInterval(callTimer);

        callTimer = null;
    }
}


function startCallTimer() {

    if (callTimer) {
        return;
    }

    callTimer =
        setInterval(
            () => {

                callSeconds++;

                updateCallTimerText();

            },
            1000
        );
}


function updateCallTimerText() {

    if (callSeconds <= 0) {
        return;
    }

    const minutes =
        Math.floor(
            callSeconds / 60
        )
        .toString()
        .padStart(2,"0");

    const seconds =
        (
            callSeconds % 60
        )
        .toString()
        .padStart(2,"0");

    $("callStatus")
        .textContent =
        minutes +
        ":" +
        seconds;
}


async function acceptIncomingCall() {

    if (!incomingCall) {
        return;
    }

    activeCallUser =
        incomingCall.from;

    activeCallVideo =
        !!incomingCall.video;

    try {

        closeModal(
            "incomingCallModal"
        );

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true,
                    video:
                        activeCallVideo
                });

        peerConnection =
            createPeerConnection();

        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        )
            );

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingCall.offer
                )
            );

        const answer =
            await peerConnection
                .createAnswer();

        await peerConnection
            .setLocalDescription(
                answer
            );

        sendSocket({

            type:"answer",

            to:
                activeCallUser,

            answer:
                peerConnection
                    .localDescription
        });

        const user =
            await getUser(
                activeCallUser
            );

        showCallUI(user);

        incomingCall = null;

    } catch {

        endCallUI();

        alert(
            "Не удалось принять звонок"
        );
    }
}


function rejectIncomingCall() {

    if (!incomingCall) {
        return;
    }

    sendSocket({

        type:"reject-call",

        to:
            incomingCall.from
    });

    incomingCall = null;

    closeModal(
        "incomingCallModal"
    );
}


async function handleAnswer(answer) {

    if (!peerConnection) {
        return;
    }

    try {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );

        startCallTimer();

    } catch {}
}


function toggleMicrophone() {

    if (!localStream) {
        return;
    }

    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !track.enabled;

                microphoneEnabled =
                    track.enabled;
            }
        );

    $("micButton").textContent =
        microphoneEnabled
            ? "🎙️"
            : "🔇";
}


function toggleCamera() {

    if (!localStream) {
        return;
    }

    localStream
        .getVideoTracks()
        .forEach(
            track => {

                track.enabled =
                    !track.enabled;

                cameraEnabled =
                    track.enabled;
            }
        );

    $("cameraButton").textContent =
        cameraEnabled
            ? "📷"
            : "🚫";
}


function hangupCall() {

    if (activeCallUser) {

        sendSocket({

            type:"hangup",

            to:
                activeCallUser
        });
    }

    endCallUI();
}


function endCallUI() {

    if (callTimer) {

        clearInterval(callTimer);

        callTimer = null;
    }

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;
    }

    if (peerConnection) {

        try {
            peerConnection.close();
        } catch {}

        peerConnection = null;
    }

    $("remoteVideo").srcObject = null;
    $("localVideo").srcObject = null;

    $("callScreen")
        .classList
        .add("hidden");

    activeCallUser = "";
    callSeconds = 0;
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id) {

    $(id)
        .classList
        .add("hidden");
}


/* =========================================================
   INITIALIZATION
========================================================= */

initEmojiPicker();

autoLogin();

</script>
