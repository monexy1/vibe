<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vibe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b1020;
            --panel: #151b2f;
            --panel2: #1c2440;
            --text: #ffffff;
            --muted: #98a2c0;
            --accent: #8b5cf6;
            --accent2: #6d28d9;
            --border: rgba(255,255,255,0.08);
            --bubble: #27304f;
            --bubble-mine: #8b5cf6;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* =========================
           AUTH
        ========================= */

        .auth {
            width: 420px;
            max-width: calc(100% - 24px);
            margin: 70px auto;
            padding: 38px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        }

        .auth-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899,
                #06b6d4
            );
            font-size: 34px;
            font-weight: bold;
            box-shadow: 0 15px 35px rgba(139,92,246,0.35);
        }

        .auth h1 {
            margin: 0;
            font-size: 44px;
        }

        .auth p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .auth input {
            width: 100%;
            padding: 14px 16px;
            margin: 7px 0;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .auth input:focus {
            border-color: var(--accent);
        }

        .main-button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
            );
            color: white;
            font-weight: bold;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 14px;
            background: var(--panel2);
            color: white;
            border: 1px solid var(--border);
        }

        /* =========================
           APP
        ========================= */

        .messenger {
            display: none;
            width: 100%;
            height: 100dvh;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            width: 100%;
            height: 100%;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            height: 100%;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899,
                #06b6d4
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .brand h2 {
            margin: 0;
            font-size: 22px;
        }

        .profile-button {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--panel2);
            color: white;
            border: 1px solid var(--border);
        }

        .search-box {
            position: relative;
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .section-title {
            color: var(--muted);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 8px 4px;
        }

        .friends-list {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .friend,
        .search-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 5px 0;
            border-radius: 14px;
            cursor: pointer;
            background: transparent;
            transition: 0.15s;
        }

        .friend:hover,
        .friend.active,
        .search-user:hover {
            background: var(--panel2);
        }

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 14px;
            object-fit: cover;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-login {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-results {
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .add-button {
            width: auto;
            padding: 7px 10px;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-size: 12px;
        }

        .remove-button {
            width: auto;
            padding: 7px 10px;
            border-radius: 10px;
            background: #ef4444;
            color: white;
            font-size: 12px;
        }

        .empty-side {
            color: var(--muted);
            text-align: center;
            padding: 25px 10px;
            font-size: 13px;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(139,92,246,0.08),
                    transparent 35%
                ),
                var(--bg);
        }

        .chat-header {
            min-height: 74px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(21,27,47,0.7);
            backdrop-filter: blur(12px);
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-user .avatar {
            width: 46px;
            height: 46px;
            border-radius: 15px;
        }

        .chat-user-name {
            font-weight: bold;
        }

        .chat-user-status {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: min(65%, 620px);
            width: fit-content;
            padding: 11px 15px;
            margin: 8px 0;
            background: var(--bubble);
            border-radius: 18px 18px 18px 6px;
            word-break: break-word;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .message.mine {
            margin-left: auto;
            background: var(--bubble-mine);
            border-radius: 18px 18px 6px 18px;
        }

        .message.square {
            border-radius: 7px;
        }

        .message.neon {
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 0 18px rgba(139,92,246,0.2),
                inset 0 0 15px rgba(255,255,255,0.03);
        }

        .message-time {
            margin-top: 5px;
            font-size: 10px;
            opacity: 0.65;
        }

        .empty-chat {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-align: center;
            padding: 30px;
        }

        .message-input {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
            background: rgba(21,27,47,0.8);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .emoji-button {
            width: 46px;
            min-width: 46px;
            border-radius: 14px;
            background: var(--panel2);
            color: white;
            border: 1px solid var(--border);
        }

        .message-input input {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .send-button {
            width: 110px;
            border-radius: 14px;
            color: white;
            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
            );
            font-weight: bold;
        }

        .emoji-panel {
            position: absolute;
            left: 12px;
            bottom: 72px;
            width: 270px;
            padding: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            z-index: 10;
        }

        .emoji-panel.show {
            display: grid;
        }

        .emoji-item {
            padding: 8px;
            border-radius: 10px;
            background: var(--panel2);
            color: white;
            font-size: 20px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 460px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px;
        }

        .modal-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title h2 {
            margin: 0;
        }

        .close-button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--panel2);
            color: white;
        }

        .profile-preview {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .profile-preview .avatar {
            width: 72px;
            height: 72px;
            border-radius: 22px;
        }

        .profile-form label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin: 13px 0 6px;
        }

        .profile-form input,
        .profile-form textarea,
        .profile-form select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .profile-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .save-profile {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            border-radius: 13px;
            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
            );
            color: white;
            font-weight: bold;
        }

        .profile-login {
            color: var(--muted);
            font-size: 13px;
        }

        .photo-label {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 11px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
        }

        /* =========================
           ТЕМЫ
        ========================= */

        body.theme-light {
            --bg: #eef2ff;
            --panel: #ffffff;
            --panel2: #f1f5f9;
            --text: #111827;
            --muted: #64748b;
            --border: rgba(15,23,42,0.08);
            --bubble: #e2e8f0;
        }

        body.theme-purple {
            --bg: #160b2c;
            --panel: #21123d;
            --panel2: #2e1a52;
            --accent: #a855f7;
            --accent2: #7e22ce;
            --bubble: #38245a;
            --bubble-mine: #a855f7;
        }

        body.theme-ocean {
            --bg: #061923;
            --panel: #0b2530;
            --panel2: #103746;
            --accent: #06b6d4;
            --accent2: #0284c7;
            --bubble: #173f4e;
            --bubble-mine: #0891b2;
        }

        body.theme-sunset {
            --bg: #24100e;
            --panel: #361815;
            --panel2: #48211b;
            --accent: #f97316;
            --accent2: #e11d48;
            --bubble: #55261f;
            --bubble-mine: #f97316;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .auth {
                width: calc(100% - 20px);
                margin: 25px auto;
                padding: 25px 18px;
            }

            .auth h1 {
                font-size: 36px;
            }

            .layout {
                grid-template-columns: 150px 1fr;
            }

            .sidebar {
                padding: 10px;
            }

            .brand h2 {
                font-size: 19px;
            }

            .brand-icon {
                width: 36px;
                height: 36px;
                border-radius: 12px;
            }

            .profile-button {
                width: 36px;
                height: 36px;
            }

            .search-box input {
                padding: 10px;
                font-size: 13px;
            }

            .friend,
            .search-user {
                padding: 8px 5px;
                gap: 6px;
            }

            .avatar {
                width: 34px;
                height: 34px;
                min-width: 34px;
                border-radius: 11px;
                font-size: 12px;
            }

            .user-name {
                font-size: 12px;
            }

            .user-login {
                font-size: 10px;
            }

            .add-button,
            .remove-button {
                padding: 5px 7px;
                font-size: 10px;
            }

            .chat-header {
                min-height: 64px;
                padding: 10px;
            }

            .chat-user .avatar {
                width: 38px;
                height: 38px;
            }

            .chat-user-name {
                font-size: 14px;
            }

            .chat-user-status {
                font-size: 10px;
            }

            .messages {
                padding: 10px;
            }

            .message {
                max-width: 85%;
                font-size: 14px;
                padding: 9px 12px;
            }

            .message-input {
                padding: 7px;
            }

            .emoji-button {
                width: 40px;
                min-width: 40px;
            }

            .send-button {
                width: 82px;
                font-size: 12px;
            }

            .message-input input {
                font-size: 13px;
                padding: 10px;
            }

            .emoji-panel {
                width: 230px;
            }
        }

        @media (max-width: 400px) {

            .layout {
                grid-template-columns: 132px 1fr;
            }

            .sidebar {
                padding: 7px;
            }

            .brand h2 {
                font-size: 17px;
            }

            .section-title {
                font-size: 10px;
            }

            .search-box input {
                font-size: 11px;
            }

            .message {
                font-size: 13px;
            }

            .send-button {
                width: 72px;
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         ВХОД
    ========================= -->

    <div
        class="auth"
        id="authScreen"
    >

        <div class="auth-logo">
            V
        </div>

        <h1>Vibe</h1>

        <p>
            Твой новый мессенджер
        </p>

        <input
            id="login"
            type="text"
            placeholder="Логин"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
        >

        <button
            class="main-button"
            onclick="loginAccount()"
        >
            Войти
        </button>

        <button
            class="register-button"
            onclick="window.location.href='register.html'"
        >
            Создать аккаунт
        </button>

    </div>


    <!-- =========================
         МЕССЕНДЖЕР
    ========================= -->

    <div
        class="messenger"
        id="messenger"
    >

        <div class="layout">

            <!-- SIDEBAR -->

            <aside class="sidebar">

                <div class="sidebar-top">

                    <div class="brand">

                        <div class="brand-icon">
                            V
                        </div>

                        <h2>Vibe</h2>

                    </div>

                    <button
                        class="profile-button"
                        onclick="openProfile()"
                    >
                        👤
                    </button>

                </div>


                <div class="search-box">

                    <input
                        id="search"
                        type="text"
                        placeholder="Найти пользователя..."
                        oninput="searchUsers()"
                    >

                </div>


                <div
                    class="search-results"
                    id="searchResults"
                ></div>


                <div class="section-title">
                    Мои чаты
                </div>


                <div
                    class="friends-list"
                    id="friendsList"
                ></div>

            </aside>


            <!-- CHAT -->

            <main class="chat">

                <div
                    class="chat-header"
                    id="chatHeader"
                >

                    <div class="chat-user">

                        <div
                            class="avatar"
                            id="chatAvatar"
                        >
                            V
                        </div>

                        <div>

                            <div
                                class="chat-user-name"
                                id="chatTitle"
                            >
                                Выбери друга
                            </div>

                            <div
                                class="chat-user-status"
                                id="chatStatus"
                            >
                                Найди человека через поиск
                            </div>

                        </div>

                    </div>

                </div>


                <div
                    class="messages"
                    id="messages"
                >

                    <div class="empty-chat">

                        💬<br><br>

                        Добавь человека в друзья,
                        чтобы начать общение

                    </div>

                </div>


                <div class="message-input">

                    <div
                        class="emoji-panel"
                        id="emojiPanel"
                    >

                        <button
                            class="emoji-item"
                            onclick="addEmoji('😀')"
                        >😀</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('😂')"
                        >😂</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('😍')"
                        >😍</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('😎')"
                        >😎</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('😭')"
                        >😭</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('😡')"
                        >😡</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('❤️')"
                        >❤️</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('🔥')"
                        >🔥</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('👍')"
                        >👍</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('👎')"
                        >👎</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('🎉')"
                        >🎉</button>

                        <button
                            class="emoji-item"
                            onclick="addEmoji('💀')"
                        >💀</button>

                    </div>


                    <button
                        class="emoji-button"
                        onclick="toggleEmojiPanel()"
                    >
                        😊
                    </button>


                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Введите сообщение..."
                        onkeydown="handleEnter(event)"
                    >


                    <button
                        class="send-button"
                        onclick="sendMessage()"
                    >
                        Отправить
                    </button>

                </div>

            </main>

        </div>

    </div>


    <!-- =========================
         PROFILE MODAL
    ========================= -->

    <div
        class="modal"
        id="profileModal"
    >

        <div class="modal-card">

            <div class="modal-title">

                <h2>
                    Мой профиль
                </h2>

                <button
                    class="close-button"
                    onclick="closeProfile()"
                >
                    ✕
                </button>

            </div>


            <div class="profile-preview">

                <div
                    class="avatar"
                    id="profileAvatar"
                >
                    V
                </div>

                <div>

                    <div
                        class="user-name"
                        id="profilePreviewName"
                    >
                        Vibe
                    </div>

                    <div
                        class="profile-login"
                        id="profileLogin"
                    >
                        @user
                    </div>

                </div>

            </div>


            <div class="profile-form">

                <label>
                    Фото профиля
                </label>

                <input
                    id="photoInput"
                    type="file"
                    accept="image/*"
                    style="display:none"
                    onchange="handlePhoto(event)"
                >

                <label
                    class="photo-label"
                    for="photoInput"
                >
                    📷 Выбрать фото
                </label>


                <label>
                    Имя
                </label>

                <input
                    id="profileName"
                    type="text"
                    maxlength="40"
                    placeholder="Как тебя зовут?"
                >


                <label>
                    О себе
                </label>

                <textarea
                    id="profileAbout"
                    maxlength="200"
                    placeholder="Напиши что-нибудь о себе..."
                ></textarea>


                <label>
                    Стиль сообщений
                </label>

                <select id="messageStyle">

                    <option value="classic">
                        Классический
                    </option>

                    <option value="square">
                        Квадратный
                    </option>

                    <option value="neon">
                        Неоновый
                    </option>

                </select>


                <button
                    class="save-profile"
                    onclick="saveProfile()"
                >
                    Сохранить профиль
                </button>

            </div>

        </div>

    </div>


<script>

let currentUser = "";
let currentChat = "";

let friends = [];
let currentProfilePhoto = "";

let allSearchUsers = [];

let messageTimer = null;


// ============================
// ВСПОМОГАТЕЛЬНОЕ
// ============================

function getInitials(name) {

    if (!name) {
        return "V";
    }

    return name
        .trim()
        .charAt(0)
        .toUpperCase();
}


function avatarHTML(user) {

    if (user.photo) {

        return `
            <img
                class="avatar"
                src="${user.photo}"
                alt=""
            >
        `;

    }

    return `
        <div class="avatar">
            ${getInitials(user.name || user.login)}
        </div>
    `;
}


function applyTheme(theme) {

    document.body.classList.remove(
        "theme-light",
        "theme-purple",
        "theme-ocean",
        "theme-sunset"
    );

    if (theme !== "dark") {
        document.body.classList.add(
            "theme-" + theme
        );
    }

    localStorage.setItem(
        "vibeTheme",
        theme
    );
}


function applySavedTheme() {

    const theme =
        localStorage.getItem("vibeTheme") || "dark";

    applyTheme(theme);
}


// ============================
// ВХОД
// ============================

async function loginAccount() {

    const login =
        document
            .getElementById("login")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value
            .trim();

    if (!login || !password) {

        alert(
            "Заполни логин и пароль!"
        );

        return;
    }

    try {

        const response =
            await fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    login,
                    password
                })

            });

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        currentUser = login;

        localStorage.setItem(
            "vibeUser",
            currentUser
        );

        showMessenger();

    } catch {

        alert(
            "Не удалось подключиться к серверу"
        );

    }
}


// ============================
// ПОКАЗ МЕССЕНДЖЕРА
// ============================

function showMessenger() {

    document
        .getElementById("authScreen")
        .style.display = "none";

    document
        .getElementById("messenger")
        .style.display = "block";

    applySavedTheme();

    loadFriends();
}


// ============================
// ДРУЗЬЯ
// ============================

async function loadFriends() {

    try {

        const response =
            await fetch(
                "/friends?login=" +
                encodeURIComponent(currentUser)
            );

        friends =
            await response.json();

        renderFriends();

    } catch {

        console.log(
            "Ошибка загрузки друзей"
        );

    }
}


function renderFriends() {

    const list =
        document.getElementById(
            "friendsList"
        );

    list.innerHTML = "";

    if (friends.length === 0) {

        list.innerHTML = `
            <div class="empty-side">
                У тебя пока нет друзей.<br><br>
                Найди кого-нибудь через поиск.
            </div>
        `;

        return;
    }

    friends.forEach(user => {

        const div =
            document.createElement("div");

        div.className = "friend";

        if (user.login === currentChat) {
            div.classList.add("active");
        }

        div.innerHTML = `

            ${user.photo
                ? `<img
                    class="avatar"
                    src="${user.photo}"
                    alt=""
                  >`
                : `<div class="avatar">
                    ${getInitials(
                        user.name || user.login
                    )}
                  </div>`
            }

            <div class="user-info">

                <div class="user-name">
                    ${escapeHTML(
                        user.name || user.login
                    )}
                </div>

                <div class="user-login">
                    @${escapeHTML(user.login)}
                </div>

            </div>
        `;

        div.onclick =
            () => openChat(user);

        list.appendChild(div);

    });
}


// ============================
// ПОИСК
// ============================

async function searchUsers() {

    const query =
        document
            .getElementById("search")
            .value
            .trim();

    const resultBox =
        document.getElementById(
            "searchResults"
        );

    if (!query) {

        resultBox.innerHTML = "";

        return;
    }

    try {

        const response =
            await fetch(
                "/users?current=" +
                encodeURIComponent(
                    currentUser
                ) +
                "&q=" +
                encodeURIComponent(query)
            );

        allSearchUsers =
            await response.json();

        resultBox.innerHTML = "";

        if (
            allSearchUsers.length === 0
        ) {

            resultBox.innerHTML = `
                <div class="empty-side">
                    Пользователь не найден
                </div>
            `;

            return;
        }

        allSearchUsers.forEach(user => {

            const div =
                document.createElement("div");

            div.className =
                "search-user";

            div.innerHTML = `

                ${user.photo
                    ? `<img
                        class="avatar"
                        src="${user.photo}"
                        alt=""
                      >`
                    : `<div class="avatar">
                        ${getInitials(
                            user.name ||
                            user.login
                        )}
                      </div>`
                }

                <div class="user-info">

                    <div class="user-name">
                        ${escapeHTML(
                            user.name ||
                            user.login
                        )}
                    </div>

                    <div class="user-login">
                        @${escapeHTML(
                            user.login
                        )}
                    </div>

                </div>

                ${
                    user.isFriend

                    ? `
                        <button
                            class="remove-button"
                            onclick="removeFriend(
                                event,
                                '${escapeJS(user.login)}'
                            )"
                        >
                            Убрать
                        </button>
                    `

                    : `
                        <button
                            class="add-button"
                            onclick="addFriend(
                                event,
                                '${escapeJS(user.login)}'
                            )"
                        >
                            +
                        </button>
                    `
                }

            `;

            div.addEventListener(
                "dblclick",
                () => openChat(user)
            );

            resultBox.appendChild(div);

        });

    } catch {

        resultBox.innerHTML = `
            <div class="empty-side">
                Ошибка поиска
            </div>
        `;

    }
}


// ============================
// ДОБАВИТЬ ДРУГА
// ============================

async function addFriend(event, login) {

    event.stopPropagation();

    try {

        const response =
            await fetch(
                "/friends",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        from: currentUser,
                        to: login,
                        action: "add"
                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        await loadFriends();

        await searchUsers();

    } catch {

        alert(
            "Не удалось добавить друга"
        );

    }
}


// ============================
// УДАЛИТЬ ДРУГА
// ============================

async function removeFriend(
    event,
    login
) {

    event.stopPropagation();

    try {

        const response =
            await fetch(
                "/friends",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        from: currentUser,
                        to: login,
                        action: "remove"
                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        if (currentChat === login) {

            currentChat = "";

            document
                .getElementById("chatTitle")
                .textContent =
                    "Выбери друга";

            document
                .getElementById("chatStatus")
                .textContent =
                    "Найди человека через поиск";

            document
                .getElementById("messages")
                .innerHTML = `
                    <div class="empty-chat">
                        💬<br><br>
                        Добавь человека в друзья,
                        чтобы начать общение
                    </div>
                `;

            if (messageTimer) {
                clearInterval(
                    messageTimer
                );
            }
        }

        await loadFriends();
        await searchUsers();

    } catch {

        alert(
            "Ошибка удаления друга"
        );

    }
}


// ============================
// ОТКРЫТЬ ЧАТ
// ============================

function openChat(user) {

    if (!user) {
        return;
    }

    currentChat =
        user.login;

    document
        .getElementById("chatTitle")
        .textContent =
            user.name || user.login;

    document
        .getElementById("chatStatus")
        .textContent =
            "@" + user.login;

    const chatAvatar =
        document.getElementById(
            "chatAvatar"
        );

    if (user.photo) {

        chatAvatar.outerHTML = `
            <img
                class="avatar"
                id="chatAvatar"
                src="${user.photo}"
                alt=""
            >
        `;

    } else {

        chatAvatar.outerHTML = `
            <div
                class="avatar"
                id="chatAvatar"
            >
                ${getInitials(
                    user.name || user.login
                )}
            </div>
        `;
    }

    loadMessages();

    if (messageTimer) {

        clearInterval(
            messageTimer
        );

    }

    messageTimer =
        setInterval(
            loadMessages,
            1000
        );

    renderFriends();
}


// ============================
// СООБЩЕНИЯ
// ============================

async function loadMessages() {

    if (!currentChat) {
        return;
    }

    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser
                ) +
                "&user2=" +
                encodeURIComponent(
                    currentChat
                )
            );

        const messages =
            await response.json();

        const container =
            document.getElementById(
                "messages"
            );

        container.innerHTML = "";

        if (messages.length === 0) {

            container.innerHTML = `
                <div class="empty-chat">
                    💬<br><br>
                    Здесь пока нет сообщений.<br>
                    Напиши первым!
                </div>
            `;

            return;
        }

        const style =
            localStorage.getItem(
                "vibeMessageStyle"
            ) || "classic";

        messages.forEach(message => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "message " + style;

            if (
                message.from === currentUser
            ) {

                div.classList.add(
                    "mine"
                );

            }

            const time =
                new Date(
                    message.time
                );

            div.innerHTML = `
                ${escapeHTML(
                    message.text
                )}

                <div class="message-time">
                    ${time.toLocaleTimeString(
                        [],
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )}
                </div>
            `;

            container.appendChild(div);

        });

        container.scrollTop =
            container.scrollHeight;

    } catch {

        console.log(
            "Ошибка загрузки сообщений"
        );

    }
}


// ============================
// ОТПРАВКА
// ============================

async function sendMessage() {

    if (!currentChat) {

        alert(
            "Сначала добавь пользователя в друзья!"
        );

        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    try {

        const response =
            await fetch(
                "/send-message",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        from:
                            currentUser,

                        to:
                            currentChat,

                        text:
                            text

                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(
                result.message
            );

            return;
        }

        input.value = "";

        loadMessages();

    } catch {

        alert(
            "Ошибка отправки сообщения"
        );

    }
}


// ============================
// ENTER
// ============================

function handleEnter(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }
}


// ============================
// EMOJI
// ============================

function toggleEmojiPanel() {

    document
        .getElementById("emojiPanel")
        .classList.toggle("show");

}


function addEmoji(emoji) {

    const input =
        document.getElementById(
            "messageInput"
        );

    input.value += emoji;

    input.focus();

    document
        .getElementById("emojiPanel")
        .classList.remove("show");
}


// ============================
// ПРОФИЛЬ
// ============================

async function openProfile() {

    try {

        const response =
            await fetch(
                "/profile?login=" +
                encodeURIComponent(
                    currentUser
                )
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        const user =
            result.user;

        document
            .getElementById(
                "profileName"
            )
            .value =
                user.name || "";

        document
            .getElementById(
                "profileAbout"
            )
            .value =
                user.about || "";

        document
            .getElementById(
                "profileLogin"
            )
            .textContent =
                "@" + user.login;

        document
            .getElementById(
                "profilePreviewName"
            )
            .textContent =
                user.name ||
                user.login;

        document
            .getElementById(
                "messageStyle"
            )
            .value =
                user.messageStyle ||
                "classic";

        currentProfilePhoto =
            user.photo || "";

        const avatar =
            document.getElementById(
                "profileAvatar"
            );

        if (user.photo) {

            avatar.outerHTML = `
                <img
                    class="avatar"
                    id="profileAvatar"
                    src="${user.photo}"
                    alt=""
                >
            `;

        } else {

            avatar.outerHTML = `
                <div
                    class="avatar"
                    id="profileAvatar"
                >
                    ${getInitials(
                        user.name ||
                        user.login
                    )}
                </div>
            `;
        }

        document
            .getElementById(
                "profileModal"
            )
            .classList.add("show");

    } catch {

        alert(
            "Не удалось загрузить профиль"
        );

    }
}


function closeProfile() {

    document
        .getElementById(
            "profileModal"
        )
        .classList.remove("show");

}


function handlePhoto(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function() {

        const image =
            new Image();

        image.onload =
            function() {

                const canvas =
                    document.createElement(
                        "canvas"
                    );

                const maxSize = 500;

                let width =
                    image.width;

                let height =
                    image.height;

                if (width > height) {

                    if (width > maxSize) {

                        height =
                            Math.round(
                                height *
                                maxSize /
                                width
                            );

                        width =
                            maxSize;
                    }

                } else {

                    if (height > maxSize) {

                        width =
                            Math.round(
                                width *
                                maxSize /
                                height
                            );

                        height =
                            maxSize;
                    }
                }

                canvas.width =
                    width;

                canvas.height =
                    height;

                const ctx =
                    canvas.getContext(
                        "2d"
                    );

                ctx.drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                );

                currentProfilePhoto =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.82
                    );

                const avatar =
                    document.getElementById(
                        "profileAvatar"
                    );

                avatar.outerHTML = `
                    <img
                        class="avatar"
                        id="profileAvatar"
                        src="${currentProfilePhoto}"
                        alt=""
                    >
                `;

            };

        image.src =
            reader.result;
    };

    reader.readAsDataURL(file);
}


async function saveProfile() {

    const name =
        document
            .getElementById(
                "profileName"
            )
            .value
            .trim();

    const about =
        document
            .getElementById(
                "profileAbout"
            )
            .value
            .trim();

    const messageStyle =
        document
            .getElementById(
                "messageStyle"
            )
            .value;

    try {

        const response =
            await fetch(
                "/profile",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        login:
                            currentUser,

                        name,
                        about,

                        photo:
                            currentProfilePhoto,

                        messageStyle

                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(
                result.message
            );

            return;
        }

        localStorage.setItem(
            "vibeMessageStyle",
            messageStyle
        );

        closeProfile();

        await loadFriends();

        if (currentChat) {

            const friend =
                friends.find(
                    user =>
                        user.login ===
                        currentChat
                );

            if (friend) {

                document
                    .getElementById(
                        "chatTitle"
                    )
                    .textContent =
                        friend.name ||
                        friend.login;

                const chatAvatar =
                    document.getElementById(
                        "chatAvatar"
                    );

                if (friend.photo) {

                    chatAvatar.outerHTML = `
                        <img
                            class="avatar"
                            id="chatAvatar"
                            src="${friend.photo}"
                            alt=""
                        >
                    `;

                }
            }
        }

        loadMessages();

        alert(
            "Профиль сохранён!"
        );

    } catch {

        alert(
            "Ошибка сохранения профиля"
        );

    }
}


// ============================
// ВЫХОД
// ============================

function logout() {

    localStorage.removeItem(
        "vibeUser"
    );

    currentUser = "";
    currentChat = "";

    if (messageTimer) {

        clearInterval(
            messageTimer
        );

    }

    document
        .getElementById(
            "messenger"
        )
        .style.display = "none";

    document
        .getElementById(
            "authScreen"
        )
        .style.display = "block";
}


// ============================
// ЗАЩИТА HTML
// ============================

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeJS(text) {

    return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
}


// ============================
// ТЕМА
// ============================

applySavedTheme();


// ============================
// АВТОВХОД
// ============================

const savedUser =
    localStorage.getItem(
        "vibeUser"
    );

if (savedUser) {

    currentUser =
        savedUser;

    showMessenger();

}

</script>

</body>
</html>
