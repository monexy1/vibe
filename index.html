   ПК + ТЕЛЕФОН
========================================== */

html,
body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
}

}

.sidebar,
.chat,
.friends,
.messages {
    min-width: 0;
    min-height: 0;
}

.chat {
    overflow: hidden;
}

.messages {
    overflow-x: hidden;
    overflow-y: auto;
}

        grid-template-columns:

    }

    .sidebar {

        height: 100%;
    }

    .chat {
        width: 100%;
        height: 100%;
    }

    .chat-head {
        flex-shrink: 0;
    }

    .messages {
        flex: 1;
        min-height: 0;
    }

    .composer {
        flex-shrink: 0;
    }
}

@media (max-width: 750px) {

        grid-template-columns:

        overflow: hidden;

        font-size: 13px;
    }

       ПОИСК

       РЕЗУЛЬТАТЫ ПОИСКА

    .messages {

    .time {

    }


    /* ======================================

    .composer {

        gap: 5px;
    }

    .composer input {

    .emoji-btn {

    }

    .send {

        border-radius: 10px;
    }

    }

        width: 100%;

        max-width: 400px;

        max-height:
            calc(100dvh - 16px);

        padding: 14px;

        border-radius: 16px;
