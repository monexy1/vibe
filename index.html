<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vibe</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
}

body.booting > #authScreen,
body.booting > #app {
    display: none !important;
}

:root {
    --bg: #0b1020;
    --panel: #151b2f;
    --panel2: #202943;
    --text: #ffffff;
    --muted: #9aa5c1;
    --accent: #8b5cf6;
    --accent2: #6d28d9;
    --bubble: #293352;
    --border: rgba(255,255,255,0.08);
}

body.light {
    --bg: #eef2ff;
    --panel: #ffffff;
    --panel2: #f1f5f9;
    --text: #111827;
    --muted: #64748b;
    --accent: #6366f1;
    --accent2: #4f46e5;
    --bubble: #e2e8f0;
    --border: rgba(0,0,0,0.08);
}

body.ocean {
    --bg: #071923;
    --panel: #0d2835;
    --panel2: #123b4d;
    --text: #ffffff;
    --muted: #91b7c7;
    --accent: #06b6d4;
    --accent2: #0891b2;
    --bubble: #16465a;
    --border: rgba(255,255,255,0.08);
}

body.sunset {
    --bg: #24120f;
    --panel: #351a18;
    --panel2: #54231e;
    --text: #ffffff;
    --muted: #d5aaa3;
    --accent: #f97316;
    --accent2: #ea580c;
    --bubble: #633129;
    --border: rgba(255,255,255,0.08);
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.auth {
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.logo {
    font-size: 38px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}

.auth input {
    width: 100%;
    margin-bottom: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.primary {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    color: white;
    background: var(--accent);
    font-weight: 700;
}

.primary:hover {
    background: var(--accent2);
}

.auth-message {
    min-height: 22px;
    margin-top: 12px;
    text-align: center;
    color: #f87171;
}

.app {
    width: 100%;
    height: 100dvh;
}

.layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
}

.sidebar {
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
}

.side-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.brand {
    font-size: 26px;
    font-weight: 800;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.search {
    position: relative;
    margin-bottom: 10px;
}

.search input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.results {
    max-height: 190px;
    overflow-y: auto;
    margin-bottom: 8px;
}

.friends {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
}

.person {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 13px;
    cursor: pointer;
    background: transparent;
}

.person:hover,
.person.active {
    background: var(--panel2);
}

.avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-weight: 700;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.person-info {
    min-width: 0;
    flex: 1;
}

.person-name {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.person-login {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat-count {
    min-width: 26px;
    height: 26px;
    padding: 0 7px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: 700;
}

.channel-sidebar-icon {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 13px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 21px;
    overflow: hidden;
}

.channel-sidebar-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bottom-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.bottom-buttons button {
    flex: 1;
    padding: 10px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.chat {
    min-width: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
}

.chat-head {
    flex-shrink: 0;
    min-height: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.chat-user {
    min-width: 0;
    flex: 1;
    cursor: pointer;
}

.chat-name {
    font-weight: 800;
}

.chat-status {
    font-size: 12px;
    color: var(--muted);
}

.call-buttons {
    display: flex;
    gap: 7px;
}

.call-buttons button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.mobile-back-btn {
    display: none;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    font-size: 20px;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px;
    -webkit-overflow-scrolling: touch;
}

.empty-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
}

.message-row {
    display: flex;
    margin-bottom: 9px;
}

.message-row.mine {
    justify-content: flex-end;
}

.message {
    max-width: min(70%, 650px);
    padding: 10px 13px;
    border-radius: 15px;
    background: var(--bubble);
    word-break: break-word;
}

.message.mine {
    background: var(--accent);
    color: white;
}

.message-time {
    font-size: 10px;
    opacity: .65;
    margin-top: 4px;
    text-align: right;
}

.composer {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.composer input {
    min-width: 0;
    flex: 1;
    padding: 13px;
    border-radius: 13px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.composer button {
    width: 48px;
    border: 0;
    border-radius: 13px;
    background: var(--accent);
    color: white;
}

.channel-post {
    background: var(--panel2);
    border-radius: 15px;
    padding: 13px;
    margin-bottom: 10px;
}

.channel-post-author {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}

.channel-post-author .avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
    font-size: 13px;
}

.channel-post-author-name {
    font-weight: 700;
    font-size: 13px;
}

.channel-post-text {
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 8px;
}

.channel-post img,
.channel-post video {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
}

.channel-post-time {
    color: var(--muted);
    font-size: 11px;
    margin-top: 7px;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.65);
}

.modal-card {
    width: 100%;
    max-width: 500px;
    max-height: 90dvh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
}

.modal-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
}

.modal input,
.modal textarea,
.modal select {
    width: 100%;
    margin-bottom: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.modal textarea {
    min-height: 100px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.modal-actions button {
    flex: 1;
    padding: 11px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.modal-actions .primary {
    background: var(--accent);
}

.channels-list {
    max-height: 55vh;
    overflow-y: auto;
}

.channel-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 7px;
    border-radius: 14px;
    background: var(--panel2);
}

.channel-item-main {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
}

.channel-icon {
    width: 45px;
    height: 45px;
    min-width: 45px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    font-size: 20px;
    overflow: hidden;
}

.channel-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.channel-info {
    min-width: 0;
    flex: 1;
}

.channel-name {
    font-weight: 800;
}

.channel-description {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.channel-action {
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    background: var(--accent);
    color: white;
    font-size: 12px;
}

.channel-action.subscribed {
    background: var(--panel);
}

.profile-photo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--accent);
    overflow: hidden;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.profile-buttons button {
    flex: 1;
}

.call-screen {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(4,7,15,.97);
    display: flex;
    flex-direction: column;
}

.call-top {
    padding: 25px 20px 10px;
    text-align: center;
    color: white;
}

.call-profile-photo {
    width: 86px;
    height: 86px;
    margin: 0 auto 12px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.call-profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.call-name {
    font-size: 24px;
    font-weight: 800;
}

.call-status {
    margin-top: 6px;
    color: #aeb8d0;
    font-size: 14px;
}

.call-video {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

#remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#localVideo {
    position: absolute;
    right: 15px;
    bottom: 15px;
    width: 150px;
    max-height: 220px;
    border-radius: 15px;
    object-fit: cover;
    background: #111;
    border: 2px solid rgba(255,255,255,.15);
}

.call-controls {
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

.call-controls button {
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 50%;
    background: #26304a;
    color: white;
    font-size: 19px;
}

.call-controls .end-call {
    background: #dc2626;
    width: 64px;
    height: 64px;
}

.incoming-card {
    text-align: center;
}

.incoming-profile-photo {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 30px;
}

.incoming-profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.incoming-buttons {
    display: flex;
    gap: 10px;
}

.incoming-buttons button {
    flex: 1;
}

@media (max-width: 750px) {

    html,
    body {
        height: 100%;
        overflow: hidden;
    }

    .layout {
        position: relative;
        display: block;
        width: 100%;
        height: 100dvh;
    }

    .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100dvh;
        border-right: 0;
        padding:
            max(10px, env(safe-area-inset-top))
            10px
            max(8px, env(safe-area-inset-bottom))
            10px;
        z-index: 2;
    }

    .chat {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100dvh;
        display: none;
        z-index: 3;
    }

    .app.mobile-chat-open .sidebar {
        display: none;
    }

    .app.mobile-chat-open .chat {
        display: flex;
    }

    .side-top {
        justify-content: flex-start;
        margin-bottom: 12px;
    }

    .side-top .icon-btn {
        order: 1;
    }

    .side-top .brand {
        order: 2;
    }

    .search input {
        height: 48px;
        font-size: 16px;
    }

    .person {
        min-height: 62px;
        margin-bottom: 4px;
    }

    .chat-head {
        min-height: 64px;
        padding: 8px 9px;
    }

    .mobile-back-btn {
        display: block;
        flex-shrink: 0;
    }

    .chat-head .avatar {
        width: 40px;
        height: 40px;
        min-width: 40px;
    }

    .call-buttons button {
        width: 40px;
        height: 40px;
    }

    .messages {
        padding: 12px 10px;
    }

    .message {
        max-width: 84%;
    }

    .composer {
        padding: 8px;
    }

    .composer input {
        font-size: 16px;
    }

    .composer button {
        width: 46px;
        min-width: 46px;
    }

    .modal {
        padding: 10px;
    }

    .modal-card {
        max-height: 92dvh;
        border-radius: 18px;
        padding: 17px;
    }

    #localVideo {
        width: 110px;
        max-height: 170px;
    }
}

</style>

</head>

<body class="booting">


<!-- =======================================================
     AUTH
======================================================= -->

<div id="authScreen" class="auth hidden">

    <div class="auth-card">

        <div class="logo">
            Vibe
        </div>

        <div class="subtitle">
            Твой новый мессенджер
        </div>

        <input
            id="loginInput"
            type="text"
            placeholder="Введите логин"
            autocomplete="username"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Войти
        </button>

        <button
            class="primary"
            style="margin-top:8px;"
            onclick="register()"
        >
            Создать аккаунт
        </button>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div
    id="app"
    class="app hidden"
>

    <div class="layout">

        <aside class="sidebar">

            <div class="side-top">

                <button
                    class="icon-btn"
                    onclick="openProfile()"
                    title="Профиль"
                >
                    👤
                </button>

                <div class="brand">
                    Vibe
                </div>

            </div>


            <div class="search">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Поиск людей..."
                    oninput="searchUsers()"
                >

            </div>

            <div
                id="searchResults"
                class="results"
            ></div>


            <div
                id="friends"
                class="friends"
            ></div>


            <div class="bottom-buttons">

                <button onclick="openChannels()">
                    📢 Каналы
                </button>

                <button onclick="logout()">
                    Выйти
                </button>

            </div>

        </aside>


        <main class="chat">

            <div class="chat-head">

                <button
                    id="mobileBackButton"
                    class="mobile-back-btn"
                    onclick="closeMobileChat()"
                >
                    ←
                </button>

                <div
                    id="chatAvatar"
                    class="avatar"
                    onclick="openCurrentChatProfile()"
                    title="Открыть профиль"
                    style="cursor:pointer;"
                >
                    💬
                </div>

                <div
                    class="chat-user"
                    onclick="openCurrentChatProfile()"
                >

                    <div
                        id="chatName"
                        class="chat-name"
                    >
                        Выберите чат
                    </div>

                    <div
                        id="chatStatus"
                        class="chat-status"
                    >
                        Vibe
                    </div>

                </div>

                <div
                    id="callButtons"
                    class="call-buttons"
                >

                    <button
                        onclick="startCall(false)"
                        title="Аудиозвонок"
                    >
                        📞
                    </button>

                    <button
                        onclick="startCall(true)"
                        title="Видеозвонок"
                    >
                        📹
                    </button>

                </div>

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty-chat">
                    Выберите человека,<br>
                    чтобы начать общение
                </div>

            </div>


            <div class="composer">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Написать сообщение..."
                    onkeydown="if(event.key==='Enter') sendMessage()"
                >

                <button onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </main>

    </div>

</div>


<!-- =======================================================
     PROFILE
======================================================= -->

<div
    id="profileModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div
            id="profileModalTitle"
            class="modal-title"
        >
            Профиль
        </div>

        <div
            id="profilePreview"
            class="profile-photo"
        >
            👤
        </div>

        <input
            id="profileName"
            placeholder="Имя"
        >

        <textarea
            id="profileAbout"
            placeholder="О себе"
        ></textarea>

        <input
            id="profilePhoto"
            placeholder="Ссылка на фото или data:image..."
        >

        <select id="messageStyle">

            <option value="classic">
                Classic
            </option>

            <option value="square">
                Square
            </option>

            <option value="neon">
                Neon
            </option>

        </select>

        <div
            id="profileButtons"
            class="profile-buttons"
        >

            <button
                class="primary"
                onclick="saveProfile()"
            >
                Сохранить
            </button>

            <button
                onclick="closeModal('profileModal')"
            >
                Закрыть
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     CHANNELS
======================================================= -->

<div
    id="channelsModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div class="modal-title">
            📢 Каналы
        </div>

        <button
            class="primary"

/* =========================================================
   AUTH
========================================================= */

async function login() {

    const loginValue =
        $("loginInput")
            .value
            .trim();

    const password =
        $("passwordInput")
            .value
            .trim();


    if (
        !loginValue ||
        !password
    ) {

        $("authMessage")
            .textContent =
            "Заполни все поля";

        return;
    }


    try {

        const response =
            await fetch(
                "/login",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            login:
                                loginValue,

                            password:
                                password
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            $("authMessage")
                .textContent =
                data.message;

            return;
        }


        currentUser =
            data.user;


        localStorage.setItem(
            "vibeLogin",
            currentUser.login
        );


        localStorage.setItem(
            "vibeUser",
            JSON.stringify(
                currentUser
            )
        );


        $("passwordInput")
            .value = "";


        showApp();

    } catch {

        $("authMessage")
            .textContent =
            "Сервер не отвечает";
    }
}


async function register() {

    const loginValue =
        $("loginInput")
            .value
            .trim();

    const password =

}


/* =========================================================
   AUTO LOGIN
========================================================= */

async function autoLogin() {

    try {

        const savedUser =
            localStorage.getItem(
                "vibeUser"
            );


        if (savedUser) {

            const user =
                JSON.parse(
                    savedUser

            if (

            ) {

                    await getUser(

                    );

                    localStorage.setItem(
                        "vibeUser",
                        JSON.stringify(
                            currentUser
                        )
                    );


                    showApp();

                    return;
                }
            }
        }

    } catch {}


    const savedLogin =

            "vibeLogin"
        );


    if (savedLogin) {

            .value =
            savedLogin;
    }


    $("authScreen")
        .classList

}


function showApp() {

        .classList
        .add(
            "hidden"
        );


    $("app")
        .classList
        .remove(
            "hidden"
        );


    document.body
        .classList
        .remove(
            "booting"
        );

    loadFriends();

    loadChats();

    loadChannels();
}


function logout() {

    localStorage.removeItem(
        "vibeLogin"
    );

    localStorage.removeItem(
        "vibeUser"
    );

    localStorage.removeItem(
        "vibeReadCounts"
    );

    localStorage.removeItem(
        "vibeChannelReadCounts"
    );


    if (socket) {

        try {
            socket.close();
        } catch {}

        socket = null;
    }


    if (chatTimer) {

        clearInterval(
            chatTimer
        );

        chatTimer = null;
    }


    endCallUI();


    currentUser = null;
    currentChat = "";
    currentChannel = null;

    friends = [];
    channels = [];

    readChannelCounts = {};

    $("passwordInput").value = "";

    document.body
        .classList
        .remove(
            "booting"
        );
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket() {

    if (!currentUser) {
        return;
    }


    if (
        socket &&
        (
            socket.readyState === 0 ||
            socket.readyState === 1
        )
    ) {

        return;
    }


    try {

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";


        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host
            );


        socket.onopen =
            () => {

                socket.send(
                    JSON.stringify({
                        type:
                            "auth",

                        login:
                            currentUser.login
                    })
                );
            };


        socket.onmessage =
            event => {

                try {

                    handleSocketMessage(
                        JSON.parse(
                            event.data
                        )
                    );

                } catch {}
            };


        socket.onclose =
            () => {

                socket = null;


                if (currentUser) {

                    setTimeout(
                        () => {

                            if (
                                currentUser &&
                                !socket
                            ) {

                                connectSocket();
                            }

                        },
                        3000
                    );
                }
            };

    } catch {}
}


function sendSocket(data) {

    if (
        socket &&
        socket.readyState === 1
    ) {

        socket.send(
            JSON.stringify(
                data
            )
        );
    }
}


function handleSocketMessage(data) {

    if (
        data.type ===
        "new-message"
    ) {

        if (
            currentChat &&
            !currentChannel &&
            data.message &&
            data.message.from ===
                currentChat
        ) {

            loadMessages(
                false
            );

            markChatAsRead(
                currentChat
            );

        } else {

            loadChats();
        }


        return;
    }


    if (
        data.type ===
        "new-channel-post"
    ) {

        if (
            currentChannel &&
            data.channelId ===
                currentChannel.id
        ) {

            loadChannelPosts(
                false
            );

            markChannelAsRead(
                currentChannel.id
            );

        } else {

            loadChannels();
        }


        return;
    }


    if (
        data.type ===
        "incoming-call"
    ) {

        incomingCall =
            data;


        $("incomingCallText")
            .textContent =
            (
                data.name ||
                data.from
            ) +
            " звонит вам";


        $("incomingCallPhoto")
            .innerHTML =
            data.photo
                ? `<img src="${escapeHTML(data.photo)}">`
                : "👤";


        $("incomingCallModal")
            .classList
            .remove(
                "hidden"
            );


        return;
    }


    if (
        data.type ===
        "answer"
    ) {

        handleAnswer(
            data.answer
        );

        return;
    }


    if (
        data.type ===
        "ice-candidate"
    ) {

        if (
            peerConnection &&
            data.candidate
        ) {

            peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                )
                .catch(
                    () => {}
                );
        }

        return;
    }


    if (
        data.type ===
        "call-rejected"
    ) {

        endCallUI();

        alert(
            data.reason ||
            "Звонок отклонён"
        );

        return;
    }


    if (
        data.type ===
        "hangup"
    ) {

        endCallUI();

        return;
    }
}


/* =========================================================
   SEARCH
========================================================= */

async function searchUsers() {

    const query =
        $("searchInput")
            .value
            .trim();


    const box =
        $("searchResults");


    if (!query) {

        box.innerHTML = "";

        return;
    }


    try {

        const response =
            await fetch(
                "/users?current=" +
                encodeURIComponent(
                    currentUser.login
                ) +
                "&q=" +
                encodeURIComponent(
                    query
                )
            );


        const users =
            await response.json();


        box.innerHTML = "";


        users.forEach(
            user => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "person";


                item.innerHTML =
                    personHTML(
                        user
                    );


                item.onclick =
                    () => {

                        openChat(
                            user.login
                        );

                        $("searchInput")
                            .value = "";

                        box.innerHTML = "";
                    };


                box.appendChild(
                    item
                );
            }
        );


        if (!users.length) {

            box.innerHTML =
                `
                <div
                    style="
                        color:var(--muted);
                        padding:12px;
                        text-align:center;
                    "
                >
                    Пользователь не найден
                </div>
                `;
        }

    } catch {}
}


function personHTML(
    user,
    count = 0
) {

    const avatar =
        user.photo
            ? `<img src="${escapeHTML(user.photo)}">`
            : "👤";


    return `
        <div class="avatar">
            ${avatar}
        </div>

        <div class="person-info">

            <div class="person-name">
                ${escapeHTML(
                    user.name ||
                    user.login
                )}
            </div>

            <div class="person-login">
                @${escapeHTML(
                    user.login
                )}
            </div>

        </div>

        ${
            count > 0
                ? `
                    <div class="chat-count">
                        ${count}
                    </div>
                  `
                : ""
        }
    `;
}


/* =========================================================
   FRIENDS / CHATS
========================================================= */

async function loadFriends() {

    if (!currentUser) {
        return;
    }


    try {

        const response =
            await fetch(
                "/friends?login=" +
                encodeURIComponent(
                    currentUser.login
                )
            );


        friends =
            await response.json();


        renderChats();

    } catch {}
}


async function loadChats() {

    if (!currentUser) {
        return;
    }


    try {

        const response =
            await fetch(
                "/chats?login=" +
                encodeURIComponent(
                    currentUser.login
                )
            );


        if (!response.ok) {
            return;
        }


        chats =
            await response.json();


        renderChats();

    } catch {}
}


function getUnreadCount(chat) {

    const total =
        Number(
            chat.messageCount ||
            0
        );


    const read =
        Number(
            readMessageCounts[
                chat.login
            ] ||
            0
        );


    return Math.max(
        0,
        total -
        read
    );
}


function getChannelUnreadCount(channel) {

    const total =
        Number(
            channel.postCount ||
            0
        );


    const read =
        Number(
            readChannelCounts[
                channel.id
            ] ||
            0
        );


    return Math.max(
        0,
        total -
        read
    );
}


function renderChats() {

    const box =
        $("friends");


    box.innerHTML = "";


    const subscribedChannels =
        channels.filter(
            channel =>
                channel.subscribed
        );


    const items = [];


    chats.forEach(
        chat => {

            items.push({
                type:
                    "chat",

                data:
                    chat,

                time:
                    chat.lastTime ||
                    ""
            });
        }
    );


    subscribedChannels.forEach(
        channel => {

            items.push({
                type:
                    "channel",

                data:
                    channel,

                time:
                    channel.lastTime ||
                    ""
            });
        }
    );


    items.sort(
        (a,b) =>
            new Date(
                b.time ||
                0
            ) -
            new Date(
                a.time ||
                0
            )
    );


    if (!items.length) {

        if (friends.length) {

            friends.forEach(
                user => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "person";


                    item.innerHTML =
                        personHTML(
                            user
                        );


                    item.onclick =
                        () =>
                            openChat(
                                user.login
                            );


                    box.appendChild(
                        item
                    );
                }
            );


            return;
        }


        box.innerHTML =
            `
            <div
                style="
                    color:var(--muted);
                    padding:15px;
                    text-align:center;
                "
            >
                Пока нет переписок
            </div>
            `;


        return;
    }


    items.forEach(
        itemData => {

            if (
                itemData.type ===
                "chat"
            ) {

                const chat =
                    itemData.data;


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "person";


                if (
                    chat.login ===
                    currentChat &&
                    !currentChannel
                ) {

                    item.classList.add(
                        "active"
                    );
                }


                item.innerHTML =
                    personHTML(
                        chat.user,
                        getUnreadCount(
                            chat
                        )
                    );


                item.onclick =
                    () =>
                        openChat(
                            chat.login
                        );


                box.appendChild(
                    item
                );


                return;
            }


            const channel =
                itemData.data;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "person";


            const icon =
                channel.photo
                    ? `<img src="${escapeHTML(channel.photo)}">`
                    : "📢";


            item.innerHTML =
                `
                <div class="channel-sidebar-icon">
                    ${icon}
                </div>

                <div class="person-info">

                    <div class="person-name">
                        ${escapeHTML(
                            channel.name
                        )}
                    </div>

                    <div class="person-login">
                        Канал
                    </div>

                </div>

                ${
                    getChannelUnreadCount(
                        channel
                    ) > 0
                        ? `
                            <div class="chat-count">
                                ${getChannelUnreadCount(
                                    channel
                                )}
                            </div>
                          `
                        : ""
                }
                `;


            item.onclick =
                () =>
                    openChannel(
                        channel
                    );


            box.appendChild(
                item
            );
        }
    );
}


function renderFriends() {

    renderChats();
}


/* =========================================================
   READ CHAT
========================================================= */

async function markChatAsRead(
    login
) {

    if (
        !login ||
        !currentUser
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser.login
                ) +
                "&user2=" +
                encodeURIComponent(
                    login
                )
            );


        if (!response.ok) {
            return;
        }


        const messages =
            await response.json();


        readMessageCounts[login] =
            messages.filter(
                message =>
                    message.from ===
                    login
            ).length;


        saveReadMessageCounts();

        renderChats();

    } catch {}
}


/* =========================================================
   OPEN NORMAL CHAT
========================================================= */

async function openChat(
    login
) {

    currentChannel = null;

    currentChat = login;


    openMobileChatView();


    if (chatTimer) {

        clearInterval(
            chatTimer
        );

        chatTimer = null;
    }


    $("callButtons")
        .classList
        .remove(
            "hidden"
        );


    const input =
        $("messageInput");


    input.disabled = false;

    input.placeholder =
        "Написать сообщение...";


    const user =
        await getUser(
            login
        );


    if (user) {

        $("chatName")
            .textContent =
            user.name ||
            user.login;


        $("chatStatus")
            .textContent =
            "@" +
            user.login;


        $("chatAvatar")
            .innerHTML =
            user.photo
                ? `<img src="${escapeHTML(user.photo)}">`
                : "👤";
    }


    await loadMessages(
        true
    );


    await markChatAsRead(
        login
    );


    chatTimer =
        setInterval(
            () => {

                if (
                    currentChat &&
                    !currentChannel
                ) {

                    loadMessages(
                        false
                    );

                    loadChats();
                }

            },
            1500
        );


    renderChats();


    setTimeout(
        () => {

            input.focus();

        },
        100
    );
}

/* =========================================================

========================================================= */

async function getUser(
    login
) {

    try {

        const response =
            await fetch(
                "/profile?login=" +
                encodeURIComponent(
                    login
                )
            );


        const data =
            await response.json();


        if (data.success) {

            return data.user;
        }

    } catch {}


    return null;
}


/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages(
    forceScroll = false
) {

    if (
        !currentChat ||
        !currentUser ||
        currentChannel
    ) {
        return;
    }


    const box =
        $("messages");


    const wasNearBottom =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        100;


    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser.login
                ) +
                "&user2=" +
                encodeURIComponent(
                    currentChat
                )
            );


        if (!response.ok) {
            return;
        }


        const messages =
            await response.json();


        box.innerHTML = "";


        if (!messages.length) {

            box.innerHTML =
                `
                <div class="empty-chat">
                    Пока сообщений нет.<br>
                    Напишите первым!
                </div>
                `;

            return;
        }


        messages.forEach(
            message => {

                const row =
                    document.createElement(
                        "div"
                    );


                const mine =
                    message.from ===
                    currentUser.login;


                row.className =
                    "message-row" +
                    (
                        mine
                            ? " mine"
                            : ""
                    );


                const bubble =
                    document.createElement(
                        "div"
                    );


                bubble.className =
                    "message" +
                    (
                        mine
                            ? " mine"
                            : ""
                    );


                const time =
                    new Date(
                        message.time
                    )
                        .toLocaleTimeString(
                            [],
                            {
                                hour:
                                    "2-digit",

                                minute:
                                    "2-digit"
                            }
                        );


                bubble.innerHTML =
                    `
                    <div>
                        ${escapeHTML(
                            message.text
                        )}
                    </div>

                    <div class="message-time">
                        ${time}
                    </div>
                    `;


                row.appendChild(
                    bubble
                );


                box.appendChild(
                    row
                );
            }
        );


        if (
            forceScroll ||
            wasNearBottom
        ) {

            box.scrollTop =
                box.scrollHeight;
        }

    } catch {}
}

   SEND MESSAGE / CHANNEL POST
========================================================= */

async function sendMessage() {

    /*
        Если сейчас открыт канал,
        обычная кнопка отправки превращается
        в публикацию канала.
    */

    if (currentChannel) {

        await publishChannelPostFromComposer();

        return;
    }


    const input =
        $("messageInput");


    const text =
        input.value.trim();


    if (
        !text ||
        !currentChat ||
        !currentUser
    ) {
        return;
    }


    input.value = "";


    try {

        const response =
            await fetch(
                "/send-message",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            from:
                                currentUser.login,

                            to:
                                currentChat,

                            text
                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            await loadMessages(
                true
            );

            await loadChats();

            await markChatAsRead(
                currentChat
            );
        }

    } catch {}
}

/* =========================================================
   CHANNEL POSTS
========================================================= */

async function loadChannelPosts(
    forceScroll = true
) {

    if (!currentChannel) {
        return;
    }


    try {

        const response =
            await fetch(
                "/channel-posts?channelId=" +
                encodeURIComponent(
                    currentChannel.id
                )
            );


        if (!response.ok) {
            return;
        }


        const posts =
            await response.json();


        const box =
            $("messages");


        const wasNearBottom =
            box.scrollHeight -
            box.scrollTop -
            box.clientHeight <
            100;


        box.innerHTML = "";


        if (!posts.length) {

            box.innerHTML =
                `
                <div class="empty-chat">
                    В канале пока нет публикаций
                </div>
                `;

            return;
        }


        posts.forEach(
            post => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "channel-post";


                const author =
                    post.authorUser ||
                    {
                        login:
                            post.author,

                        name:
                            post.author,

                        photo:
                            ""
                    };


                const avatar =
                    author.photo
                        ? `<img src="${escapeHTML(author.photo)}">`
                        : "👤";


                let mediaHTML = "";


                if (post.media) {

                    if (
                        post.mediaType &&
                        post.mediaType.startsWith(
                            "image"
                        )
                    ) {

                        mediaHTML =
                            `
                            <img
                                src="${escapeHTML(
                                    post.media
                                )}"
                            >
                            `;

                    } else if (
                        post.mediaType &&
                        post.mediaType.startsWith(
                            "video"
                        )
                    ) {

                        mediaHTML =
                            `
                            <video
                                src="${escapeHTML(
                                    post.media
                                )}"
                                controls
                                playsinline
                            ></video>
                            `;
                    }
                }


                item.innerHTML =
                    `
                    <div class="channel-post-author">

                        <div class="avatar">
                            ${avatar}
                        </div>

                        <div class="channel-post-author-name">
                            ${escapeHTML(
                                author.name ||
                                author.login
                            )}
                        </div>

                    </div>

                    ${
                        post.text
                            ? `
                                <div class="channel-post-text">
                                    ${escapeHTML(
                                        post.text
                                    )}
                                </div>
                              `
                            : ""
                    }

                    ${mediaHTML}

                    <div class="channel-post-time">
                        ${new Date(
                            post.time
                        ).toLocaleString()}
                    </div>
                    `;


                box.appendChild(
                    item
                );
            }
        );


        if (
            forceScroll ||
            wasNearBottom
        ) {

            box.scrollTop =
                box.scrollHeight;
        }

    } catch {}
}

                            author:
                                currentUser.login,

                            text,

                            media:
                                null,

                            mediaType:
                                ""
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message
            );

            input.value =
                text;

            return;
        }


        await loadChannelPosts(
            true
        );


        await loadChannels();


        await markChannelAsRead(
            currentChannel.id
        );

    } catch {

        input.value =
            text;


        alert(
            "Ошибка публикации"
        );
    }
}


/* =========================================================
   CALLS
========================================================= */

const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        }

    ]
};


async function startCall(
    video
) {

    if (!currentChat || currentChannel) {

        alert(
            "Сначала откройте обычный чат"
        );

        return;
    }


    if (peerConnection) {

        alert(
            "Звонок уже идёт"
        );

        return;
    }


    activeCallUser =
        currentChat;


    activeCallVideo =
        video;


    const user =
        await getUser(
            activeCallUser
        );


    try {

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:
                        true,

                    video:
                        video
                });


        microphoneEnabled = true;
        cameraEnabled = true;


        peerConnection =
            createPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        sendSocket({

            type:
                "call",

            to:
                activeCallUser,

            video,

            offer:
                peerConnection
                    .localDescription,

            name:
                currentUser.name ||
                currentUser.login,

            photo:
                currentUser.photo ||
                ""
        });


        showCallUI(
            user
        );

    } catch {

        endCallUI();

        alert(
            "Не удалось начать звонок"
        );
    }
}


function createPeerConnection() {

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                sendSocket({

                    type:
                        "ice-candidate",

                    to:
                        activeCallUser,

                    candidate:
                        event.candidate
                });
            }
        };


    pc.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {

                $("remoteVideo")
                    .srcObject =
                    event.streams[0];


                $("callStatus")
                    .textContent =
                    "Соединение установлено";


                startCallTimer();
            }
        };


    pc.onconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            const state =
                peerConnection
                    .connectionState;


            if (
                state ===
                "connected"
            ) {

                $("callStatus")
                    .textContent =
                    "Соединение установлено";


                startCallTimer();

            } else if (
                state ===
                "connecting"
            ) {

                $("callStatus")
                    .textContent =
                    "Соединение...";

            } else if (
                state ===
                "disconnected"
            ) {

                $("callStatus")
                    .textContent =
                    "Соединение прервано";

            } else if (
                state ===
                "failed"
            ) {

                $("callStatus")
                    .textContent =
                    "Ошибка соединения";
            }
        };


    return pc;
}


function showCallUI(
    user = null
) {

    $("callName")
        .textContent =
        user
            ? (
                user.name ||
                user.login
            )
            : activeCallUser;


    $("callProfilePhoto")
        .innerHTML =
        user && user.photo
            ? `<img src="${escapeHTML(user.photo)}">`
            : "👤";


    $("callStatus")
        .textContent =
        "Ожидание соединения...";


    $("callScreen")
        .classList
        .remove(
            "hidden"
        );


    if (localStream) {

        $("localVideo")
            .srcObject =
            localStream;
    }


    $("localVideo")
        .style
        .display =
        activeCallVideo
            ? "block"
            : "none";


    $("remoteVideo")
        .style
        .display =
        activeCallVideo
            ? "block"
            : "none";


    $("micButton")
        .textContent =
        "🎙️";


    $("cameraButton")
        .textContent =
        activeCallVideo
            ? "📷"
            : "🚫";


    callSeconds = 0;

    updateCallTimerText();


    if (callTimer) {

        clearInterval(
            callTimer
        );

        callTimer = null;
    }
}


function startCallTimer() {

    if (callTimer) {
        return;
    }


    callTimer =
        setInterval(
            () => {

                callSeconds++;

                updateCallTimerText();

            },
            1000
        );
}


function updateCallTimerText() {

    if (
        callSeconds <= 0
    ) {
        return;
    }


    const minutes =
        Math.floor(
            callSeconds / 60
        )
            .toString()
            .padStart(
                2,
                "0"
            );


    const seconds =
        (
            callSeconds %
            60
        )
            .toString()
            .padStart(
                2,
                "0"
            );


    $("callStatus")
        .textContent =
        minutes +
        ":" +
        seconds;
}


async function acceptIncomingCall() {

    if (!incomingCall) {
        return;
    }


    activeCallUser =
        incomingCall.from;


    activeCallVideo =
        !!incomingCall.video;


    try {

        closeModal(
            "incomingCallModal"
        );


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:
                        true,

                    video:
                        activeCallVideo
                });


        peerConnection =
            createPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        )
            );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingCall.offer
                )
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        sendSocket({

            type:
                "answer",

            to:
                activeCallUser,

            answer:
                peerConnection
                    .localDescription
        });


        const user =
            await getUser(
                activeCallUser
            );


        showCallUI(
            user
        );


        incomingCall = null;

    } catch {

        endCallUI();

        alert(
            "Не удалось принять звонок"
        );
    }
}


function rejectIncomingCall() {

    if (!incomingCall) {
        return;
    }


    sendSocket({

        type:
            "reject-call",

        to:
            incomingCall.from
    });


    incomingCall = null;


    closeModal(
        "incomingCallModal"
    );
}


async function handleAnswer(
    answer
) {

    if (!peerConnection) {
        return;
    }


    try {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );


        startCallTimer();

    } catch {}
}


function toggleMicrophone() {

    if (!localStream) {
        return;
    }


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !track.enabled;

                microphoneEnabled =
                    track.enabled;
            }
        );


    $("micButton")
        .textContent =
        microphoneEnabled
            ? "🎙️"
            : "🔇";
}


function toggleCamera() {

    if (!localStream) {
        return;
    }


    localStream
        .getVideoTracks()
        .forEach(
            track => {

                track.enabled =
                    !track.enabled;

                cameraEnabled =
                    track.enabled;
            }
        );


    $("cameraButton")
        .textContent =
        cameraEnabled
            ? "📷"
            : "🚫";
}


function hangupCall() {

    if (activeCallUser) {

        sendSocket({

            type:
                "hangup",

            to:
                activeCallUser
        });
    }


    endCallUI();
}


function endCallUI() {

    if (callTimer) {

        clearInterval(
            callTimer
        );

        callTimer = null;
    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        localStream = null;
    }


    if (peerConnection) {

        try {
            peerConnection.close();
        } catch {}


        peerConnection = null;
    }


    $("remoteVideo")
        .srcObject =
        null;


    $("localVideo")
        .srcObject =
        null;


    $("callScreen")
        .classList
        .add(
            "hidden"
        );


    activeCallUser = "";
    callSeconds = 0;
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(
    id
) {

    $(id)
        .classList
        .add(
            "hidden"
        );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}

autoLogin();
