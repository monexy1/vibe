<!DOCTYPE html>

<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Vibe</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    overflow: hidden;
    --bg: #0b1020;
    --panel: #151b2f;
    --panel2: #202943;
    --text: #ffffff;
    --muted: #9aa5c1;
    --accent: #8b5cf6;
    --accent2: #6d28d9;
    --bubble: #293352;
    --border: rgba(255,255,255,0.08);
}

body.light {
    --bg: #eef2ff;
    --panel: #ffffff;
    --panel2: #f1f5f9;
    --text: #111827;
    --muted: #64748b;
    --accent: #7c3aed;
    --accent2: #6d28d9;
    --bubble: #e2e8f0;
    --border: rgba(15,23,42,0.1);
}

body.ocean {
    --bg: #061923;
    --panel: #0b2530;
    --panel2: #103746;
    --text: #ffffff;
    --muted: #93b7c4;
    --accent: #06b6d4;
    --accent2: #0284c7;
    --bubble: #173f4e;
}

body.sunset {
    --bg: #24100e;
    --panel: #361815;
    --panel2: #48211b;
    --text: #ffffff;
    --muted: #d7aaa2;
    --accent: #f97316;
    --accent2: #e11d48;
    --bubble: #55261f;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
    border: none;
}

.auth {
    width: 410px;
    max-width: calc(100% - 20px);
    margin: 60px auto;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    text-align: center;
}

.logo {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899,
            #06b6d4
        );
    font-size: 34px;
    font-weight: bold;
}

.auth h1 {
    margin: 10px 0 5px;
    font-size: 44px;
}

.auth p {
    color: var(--muted);
}

.auth input {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.primary,
.secondary {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border-radius: 13px;
    color: white;
}

.primary {
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.secondary {
    background: var(--panel2);
    border: 1px solid var(--border);
}

.app {
    display: none;
    width: 100%;
    height: 100dvh;
}

.layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    width: 100%;
    height: 100%;
}

.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.side-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
}

.brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899,
            #06b6d4
        );
    font-weight: bold;
}

.brand h2 {
    margin: 0;
}

.account {
    color: var(--muted);
    font-size: 11px;
    max-width: 130px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.search {
    margin-top: 12px;
}

.search input {
    width: 100%;
    padding: 13px;
    margin: 0;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.results {
    max-height: 230px;
    overflow-y: auto;
}

.section {
    margin: 12px 3px 6px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
}

.friends {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
}

.person {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    margin: 4px 0;
    border-radius: 12px;
}

.person.clickable {
    cursor: pointer;
}

.person.clickable:hover,
.person.active {
    background: var(--panel2);
}

.avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 12px;
    object-fit: cover;
    display: grid;
    place-items: center;
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899
        );
    font-weight: bold;
}

.info {
    flex: 1;
    min-width: 0;
}

.name {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.login {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.friend-action,
.logout {
    width: auto;
    padding: 7px 9px;
    border-radius: 9px;
    color: white;
    font-size: 11px;
    flex-shrink: 0;
}

.friend-action {
    background: var(--accent);
}

.remove,
.logout {
    background: #ef4444;
}

.side-bottom {
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 8px;
}

.logout {
    width: 100%;
}

.chat {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
    background: var(--bg);
}

.chat-head {
    min-height: 70px;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.chat-user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
}

.bubble {
    width: fit-content;
    max-width: min(65%, 620px);
    padding: 11px 14px;
    margin: 7px 0;
    background: var(--bubble);
    border-radius: 17px 17px 17px 5px;
    word-break: break-word;
}

.bubble.mine {
    margin-left: auto;
    background: var(--accent);
    border-radius: 17px 17px 5px 17px;
}

.bubble.square {
    border-radius: 7px;
}

.bubble.neon {
    border: 1px solid var(--accent);
    box-shadow:
        0 0 16px rgba(139,92,246,0.35);
}

.time {
    font-size: 10px;
    opacity: .6;
    margin-top: 4px;
}

.empty {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
}

.composer {
    position: relative;
    display: flex;
    gap: 7px;
    padding: 9px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.composer input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    margin: 0;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.emoji-btn,
.send {
    border-radius: 12px;
    color: white;
}

.emoji-btn {
    width: 42px;
    min-width: 42px;
    background: var(--panel2);
}

.send {
    width: 105px;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.emoji-panel {
    display: none;
    position: absolute;
    left: 8px;
    bottom: 62px;
    width: 250px;
    max-width: calc(100vw - 16px);
    padding: 9px;
    grid-template-columns:
        repeat(6, minmax(0, 1fr));
    gap: 5px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.35);
}

.emoji-panel.show {
    display: grid;
}

.emoji-panel button {
    min-width: 0;
    padding: 7px 3px;
    background: var(--panel2);
    border-radius: 8px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.65);
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.modal.show {
    display: flex;
}

.profile {
    width: 450px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--panel);
    padding: 20px;
    border-radius: 20px;
    border: 1px solid var(--border);
}

.profile-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.profile-top h2 {
    margin: 0;
}

.close {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--panel2);
    color: var(--text);
}

.preview {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 15px 0;
}

.preview .avatar {
    width: 68px;
    height: 68px;
}

.profile label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin: 10px 0 4px;
}

.profile input,
.profile textarea,
.profile select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.profile textarea {
    min-height: 90px;
    resize: vertical;
}

.save {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
    color: white;
    margin-top: 10px;
}

@media (max-width: 750px) {

    .auth {
        margin: 25px auto;
        padding: 25px 18px;
    }

    .auth h1 {
        font-size: 36px;
    }

    .layout {
        grid-template-columns: 140px 1fr;
    }

    .sidebar {
        padding: 8px;
    }

    .brand h2 {
        font-size: 17px;
    }

    .account {
        max-width: 70px;
    }

    .brand-logo,
    .icon-btn {
        width: 34px;
        height: 34px;
    }

    .search input {
        font-size: 11px;
        padding: 9px;
    }

    .section {
        font-size: 9px;
    }

    .person {
        padding: 6px;
        gap: 5px;
    }

    .avatar {
        width: 32px;
        height: 32px;
        min-width: 32px;
        border-radius: 9px;
    }

    .name {
        font-size: 11px;
    }

    .login {
        font-size: 9px;
    }

    .friend-action {
        padding: 5px;
        font-size: 9px;
    }

    .logout {
        font-size: 10px;
        padding: 7px;
    }

    .chat-head {
        min-height: 60px;
        padding: 8px;
    }

    .messages {
        padding: 8px;
    }

    .bubble {
        max-width: 84%;
        font-size: 13px;
        padding: 9px 11px;
    }

    .composer {
        padding: 6px;
    }

    .emoji-btn {
        width: 36px;
        min-width: 36px;
    }

    .composer input {
        font-size: 12px;
        padding: 9px;
    }

    .send {
        width: 70px;
        font-size: 10px;
    }

    .emoji-panel {
        width: 225px;
    }
}

@media (max-width: 400px) {

    .layout {
        grid-template-columns: 125px 1fr;
    }

    .brand h2 {
        font-size: 15px;
    }

    .account {
        max-width: 58px;
    }

    .name {
        font-size: 10px;
    }

    .login {
        font-size: 8px;
    }

    .send {
        width: 64px;
        font-size: 9px;
    }

    .emoji-panel {
        width: 215px;
    }
}

</style>

</head>

</div>

<script>

const emojis = [
    "😀",
    "😂",
    "😍",
    "😎",
    "😭",
    "😡",
    "❤️",
    "🔥",
    "👍",
    "👎",
    "🎉",
    "💀",
    "😢",
    "😆",
    "🤩",
    "🥳",
    "😮",
    "🤔",
    "🙌",
    "💯",
    "✨",
    "🚀",
    "😴",
    "🤝"
];

let currentUser = "";
let currentChat = "";
let friends = [];
let currentPhoto = "";
let timer = null;

function $(id) {
    return document.getElementById(id);
}

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function initial(value) {
    const text =
        String(value || "V")
            .trim();

    return text[0]
        ? text[0].toUpperCase()
        : "V";
}

function setTheme(theme) {

    document.body.classList.remove(
        "light",
        "ocean",
        "sunset"
    );

    if (theme !== "dark") {
        document.body.classList.add(
            theme
        );
    }

    localStorage.setItem(
        "vibeTheme",
        theme
    );
}

function getTheme() {

    return (
        localStorage.getItem(
            "vibeTheme"
        ) || "dark"
    );
}

async function loginAccount() {

    const login =
        $("login")
            .value
            .trim();

    const password =
        $("password")
            .value
            .trim();

    if (!login || !password) {

        alert(
            "Заполни логин и пароль!"
        );

        return;
    }

    try {

        const response =
            await fetch(
                "/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            login,
                            password
                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                data.message
            );

            return;
        }

        currentUser =
            login;

        localStorage.setItem(
            "vibeUser",
            login
        );

        showApp();

    } catch {

        alert(
            "Не удалось подключиться к серверу"
        );
    }
}

function showApp() {

    $("auth").style.display =
        "none";

    $("app").style.display =
        "block";

    $("account").textContent =
        "@" + currentUser;

    setTheme(
        getTheme()
    );

    renderEmoji();

    loadFriends();
}

async function loadFriends() {

    try {

        const response =
            await fetch(
                "/friends?login=" +
                encodeURIComponent(
                    currentUser
                )
            );

        friends =
            await response.json();

        renderFriends();

    } catch {

        console.log(
            "Ошибка друзей"
        );
    }
}

function renderFriends() {

    const box =
        $("friends");

    box.innerHTML = "";

    if (!friends.length) {

        box.innerHTML = `
            <div
                class="empty"
                style="
                    height:auto;
                    padding:25px 5px;
                    font-size:12px
                "
            >
                Пока нет друзей.<br>
                Найди человека выше.
            </div>
        `;

        return;
    }

    friends.forEach(
        user => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "person clickable";

            if (
                user.login ===
                currentChat
            ) {
                div.classList.add(
                    "active"
                );
            }

            div.innerHTML =
                avatarHTML(user) +
                `
                <div class="info">

                    <div class="name">
                        ${escapeHTML(
                            user.name ||
                            user.login
                        )}
                    </div>

                    <div class="login">
                        @${escapeHTML(
                            user.login
                        )}
                    </div>

                </div>
                `;

            div.onclick =
                () =>
                    openChat(user);

            box.appendChild(
                div
            );
        }
    );
}

function avatarHTML(user) {

    if (user.photo) {

        return `
            <img
                class="avatar"
                src="${user.photo}"
                alt=""
            >
        `;
    }

    return `
        <div class="avatar">
            ${initial(
                user.name ||
                user.login
            )}
        </div>
    `;
}

async function searchUsers() {

    const query =
        $("search")
            .value
            .trim();

    const box =
        $("results");

    box.innerHTML = "";

    if (!query) {
        return;
    }

    try {

        const response =
            await fetch(
                "/users?current=" +
                encodeURIComponent(
                    currentUser
                ) +
                "&q=" +
                encodeURIComponent(
                    query
                )
            );

        const list =
            await response.json();

        if (!list.length) {

            box.innerHTML = `
                <div
                    class="empty"
                    style="
                        height:auto;
                        padding:15px;
                        font-size:12px
                    "
                >
                    Никого не нашли
                </div>
            `;

            return;
        }

        list.forEach(
            user => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "person";

                const safeLogin =
                    escapeHTML(
                        user.login
                    );

                div.innerHTML =
                    avatarHTML(user) +
                    `
                    <div class="info">

                        <div class="name">
                            ${escapeHTML(
                                user.name ||
                                user.login
                            )}
                        </div>

                        <div class="login">
                            @${safeLogin}
                        </div>

                    </div>
                    `;

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "friend-action";

                if (user.isFriend) {

                    button.classList.add(
                        "remove"
                    );

                    button.textContent =
                        "Убрать";

                    button.onclick =
                        event => {
                            event.stopPropagation();
                            removeFriend(
                                user.login
                            );
                        };

                } else {

                    button.textContent =
                        "+";

                    button.onclick =
                        event => {
                            event.stopPropagation();
                            addFriend(
                                user.login
                            );
                        };
                }

                div.appendChild(
                    button
                );

                div.onclick =
                    () =>
                        openChat(
                            user
                        );

                box.appendChild(
                    div
                );
            }
        );

    } catch {

        box.innerHTML = `
            <div
                class="empty"
                style="
                    height:auto;
                    padding:15px;
                    font-size:12px
                "
            >
                Ошибка поиска
            </div>
        `;
    }
}

async function addFriend(
    login
) {

    await friendAction(
        login,
        "add"
    );
}

async function removeFriend(
    login
) {

    await friendAction(
        login,
        "remove"
    );
}

async function friendAction(
    login,
    action
) {

    try {

        const response =
            await fetch(
                "/friends",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            from:
                                currentUser,
                            to:
                                login,
                            action:
                                action
                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                data.message
            );

            return;
        }

        await loadFriends();
        await searchUsers();

    } catch {

        alert(
            "Ошибка работы с друзьями"
        );
    }
}

function openChat(
    user
) {

    currentChat =
        user.login;

    $("chatTitle")
        .textContent =
            user.name ||
            user.login;

    $("chatStatus")
        .textContent =
            "@" +
            user.login;

    $("chatAvatar")
        .outerHTML =
            user.photo
                ? `
                    <img
                        class="avatar"
                        id="chatAvatar"
                        src="${user.photo}"
                        alt=""
                    >
                  `
                : `
                    <div
                        class="avatar"
                        id="chatAvatar"
                    >
                        ${initial(
                            user.name ||
                            user.login
                        )}
                    </div>
                  `;

    renderFriends();

    loadMessages();

    if (timer) {
        clearInterval(
            timer
        );
    }

    timer =
        setInterval(
            loadMessages,
            1500
        );
}

async function loadMessages() {

    if (!currentChat) {
        return;
    }

    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser
                ) +
                "&user2=" +
                encodeURIComponent(
                    currentChat
                )
            );

        const list =
            await response.json();

        const box =
            $("messages");

        box.innerHTML = "";

        if (!list.length) {

            box.innerHTML = `
                <div class="empty">
                    💬<br><br>
                    Здесь пока нет сообщений.
                </div>
            `;

            return;
        }

        const style =
            localStorage.getItem(
                "vibeStyle"
            ) || "classic";

        list.forEach(
            message => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "bubble " +
                    style;

                if (
                    message.from ===
                    currentUser
                ) {
                    div.classList.add(
                        "mine"
                    );
                }

                const time =
                    new Date(
                        message.time
                    )
                        .toLocaleTimeString(
                            [],
                            {
                                hour:
                                    "2-digit",
                                minute:
                                    "2-digit"
                            }
                        );

                div.innerHTML =
                    escapeHTML(
                        message.text
                    ) +
                    `
                    <div class="time">
                        ${time}
                    </div>
                    `;

                box.appendChild(
                    div
                );
            }
        );

        box.scrollTop =
            box.scrollHeight;

    } catch {

        console.log(
            "Ошибка сообщений"
        );
    }
}

async function sendMessage() {

    if (!currentChat) {

        alert(
            "Сначала добавь друга!"
        );

        return;
    }

    const input =
        $("messageInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    try {

        const response =
            await fetch(
                "/send-message",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            from:
                                currentUser,
                            to:
                                currentChat,
                            text:
                                text
                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                data.message
            );

            return;
        }

        input.value = "";

        loadMessages();

    } catch {

        alert(
            "Ошибка отправки сообщения"
        );
    }
}

function handleEnter(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}

function handlePhoto(
    event
) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        () => {

            const image =
                new Image();

            image.onload =
                () => {

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    const max =
                        400;

                    const scale =
                        Math.min(
                            1,
                            max / image.width,
                            max / image.height
                        );

                    canvas.width =
                        Math.round(
                            image.width * scale
                        );

                    canvas.height =
                        Math.round(
                            image.height * scale
                        );

                    const context =
                        canvas.getContext(
                            "2d"
                        );

                    context.drawImage(
                        image,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    currentPhoto =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.8
                        );

                    $("profileAvatar")
                        .outerHTML =
                            `
                            <img
                                class="avatar"
                                id="profileAvatar"
                                src="${currentPhoto}"
                                alt=""
                            >
                            `;
                };

            image.src =
                reader.result;
        };

    reader.readAsDataURL(
        file
    );
}
