```html
<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vibe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b1020;
            --panel: #151b2f;
            --panel2: #1c2440;
            --text: #ffffff;
            --muted: #98a2c0;
            --accent: #8b5cf6;
            --accent2: #6d28d9;
            --border: rgba(255,255,255,0.08);
            --bubble: #27304f;
            --bubble-mine: #8b5cf6;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* =========================
           ВХОД
        ========================= */

        .auth {
            width: 420px;
            max-width: calc(100% - 20px);
            margin: 60px auto;
            padding: 35px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 26px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        }

        .auth-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #ec4899,
                    #06b6d4
                );
            font-size: 34px;
            font-weight: bold;
        }

        .auth h1 {
            margin: 0;
            font-size: 44px;
        }

        .auth p {
            color: var(--muted);
        }

        .auth input {
            width: 100%;
            margin: 7px 0;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .main-button,
        .register-button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 14px;
            color: white;
        }

        .main-button {
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
        }

        .register-button {
            background: var(--panel2);
        }

        /* =========================
           МЕССЕНДЖЕР
        ========================= */

        .messenger {
            display: none;
            width: 100%;
            height: 100dvh;
        }

        .layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 320px 1fr;
        }

        /* =========================
           ЛЕВАЯ ПАНЕЛЬ
        ========================= */

        .sidebar {
            height: 100%;
            padding: 16px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .sidebar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #ec4899,
                    #06b6d4
                );
            font-weight: bold;
        }

        .brand h2 {
            margin: 0;
        }

        .account-name {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-button {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 14px;
            background: var(--panel2);
            color: white;
            border: 1px solid var(--border);
        }

        .search-box {
            margin-bottom: 8px;
        }

        .search-box input {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-results {
            max-height: 260px;
            overflow-y: auto;
        }

        .section-title {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            margin: 10px 4px 7px;
            letter-spacing: 0.08em;
        }

        .friends-list {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .friend,
        .search-user {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px;
            margin: 4px 0;
            border-radius: 13px;
        }

        .friend {
            cursor: pointer;
        }

        .friend:hover,
        .friend.active,
        .search-user:hover {
            background: var(--panel2);
        }

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            object-fit: cover;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #ec4899
                );
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .user-login {
            color: var(--muted);
            font-size: 11px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .add-button,
        .remove-button,
        .logout-button {
            width: auto;
            padding: 7px 9px;
            border-radius: 10px;
            color: white;
            flex-shrink: 0;
        }

        .add-button {
            background: var(--accent);
        }

        .remove-button,
        .logout-button {
            background: #ef4444;
        }

        .empty-side {
            color: var(--muted);
            text-align: center;
            padding: 20px 8px;
            font-size: 12px;
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            margin-top: 8px;
            padding-top: 9px;
        }

        .logout-button {
            width: 100%;
            margin-top: 7px;
        }

        /* =========================
           ЧАТ
        ========================= */

        .chat {
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .chat-header {
            min-height: 72px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .chat-user-name {
            font-weight: bold;
        }

        .chat-user-status {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            width: fit-content;
            max-width: min(65%, 620px);
            margin: 7px 0;
            padding: 11px 14px;
            background: var(--bubble);
            border-radius: 18px 18px 18px 6px;
            word-break: break-word;
        }

        .message.mine {
            margin-left: auto;
            background: var(--bubble-mine);
            border-radius: 18px 18px 6px 18px;
        }

        .message.square {
            border-radius: 7px;
        }

        .message.neon {
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 0 18px rgba(139,92,246,0.2);
        }

        .message-time {
            margin-top: 5px;
            font-size: 10px;
            opacity: 0.6;
        }

        .empty-chat {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--muted);
            padding: 20px;
        }

        /* =========================
           ПАНЕЛЬ СООБЩЕНИЯ
        ========================= */

        .message-input {
            position: relative;
            display: flex;
            gap: 7px;
            padding: 10px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }

        .emoji-button {
            width: 44px;
            min-width: 44px;
            border-radius: 13px;
            background: var(--panel2);
            color: white;
        }

        .message-input input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .send-button {
            width: 110px;
            min-width: 110px;
            border-radius: 13px;
            color: white;
            font-weight: bold;
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
        }

        /* =========================
           ЭМОДЗИ
        ========================= */

        .emoji-panel {
            display: none;
            position: absolute;
            left: 10px;
            bottom: 65px;
            width: 270px;
            max-width: calc(100vw - 20px);
            padding: 10px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            z-index: 50;
        }

        .emoji-panel.show {
            display: grid;
        }

        .emoji-item {
            width: 100%;
            min-width: 0;
            padding: 7px 3px;
            border-radius: 9px;
            background: var(--panel2);
            color: white;
            font-size: 18px;
        }

        /* =========================
           ПРОФИЛЬ
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0,0,0,0.65);
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 460px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            border-radius: 22px;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-top h2 {
            margin: 0;
        }

        .close-button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--panel2);
            color: white;
        }

        .profile-preview {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 18px;
        }

        .profile-preview .avatar {
            width: 70px;
            height: 70px;
            min-width: 70px;
            border-radius: 20px;
        }

        .profile-login {
            color: var(--muted);
            font-size: 13px;
            margin-top: 3px;
        }

        .profile-form label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin: 12px 0 5px;
        }

        .profile-form input,
        .profile-form textarea,
        .profile-form select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            outline: none;
        }

        .profile-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .photo-label {
            display: inline-block;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--panel2);
            cursor: pointer;
        }

        .save-profile {
            width: 100%;
            margin-top: 16px;
            padding: 13px;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
            color: white;
            font-weight: bold;
        }

        /* =========================
           ТЕМЫ
        ========================= */

        body.theme-light {
            --bg: #eef2ff;
            --panel: #ffffff;
            --panel2: #f1f5f9;
            --text: #111827;
            --muted: #64748b;
            --border: rgba(15,23,42,0.08);
            --bubble: #e2e8f0;
            --bubble-mine: #8b5cf6;
        }

        body.theme-purple {
            --bg: #160b2c;
            --panel: #21123d;
            --panel2: #2e1a52;
            --accent: #a855f7;
            --accent2: #7e22ce;
            --bubble: #38245a;
            --bubble-mine: #a855f7;
        }

        body.theme-ocean {
            --bg: #061923;
            --panel: #0b2530;
            --panel2: #103746;
            --accent: #06b6d4;
            --accent2: #0284c7;
            --bubble: #173f4e;
            --bubble-mine: #0891b2;
        }

        body.theme-sunset {
            --bg: #24100e;
            --panel: #361815;
            --panel2: #48211b;
            --accent: #f97316;
            --accent2: #e11d48;
            --bubble: #55261f;
            --bubble-mine: #f97316;
        }

        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================= */

        @media (max-width: 750px) {

            .auth {
                margin: 25px auto;
                padding: 25px 18px;
            }

            .auth h1 {
                font-size: 36px;
            }

            .layout {
                grid-template-columns: 145px 1fr;
            }

            .sidebar {
                padding: 9px;
            }

            .brand h2 {
                font-size: 18px;
            }

            .account-name {
                max-width: 80px;
                font-size: 10px;
            }

            .brand-icon,
            .profile-button {
                width: 36px;
                height: 36px;
                min-width: 36px;
                border-radius: 11px;
            }

            .search-box input {
                padding: 10px;
                font-size: 12px;
            }

            .friend,
            .search-user {
                padding: 7px 4px;
                gap: 6px;
            }

            .avatar {
                width: 34px;
                height: 34px;
                min-width: 34px;
                border-radius: 10px;
            }

            .user-name {
                font-size: 11px;
            }

            .user-login {
                font-size: 9px;
            }

            .add-button,
            .remove-button {
                padding: 5px 6px;
                font-size: 9px;
            }

            .logout-button {
                padding: 8px;
                font-size: 11px;
            }

            .chat-header {
                min-height: 62px;
                padding: 9px;
            }

            .chat-user-name {
                font-size: 13px;
            }

            .chat-user-status {
                font-size: 9px;
            }

            .messages {
                padding: 9px;
            }

            .message {
                max-width: 84%;
                font-size: 13px;
                padding: 9px 11px;
            }

            .message-input {
                padding: 7px;
            }

            .emoji-button {
                width: 38px;
                min-width: 38px;
            }

            .message-input input {
                font-size: 12px;
                padding: 10px;
            }

            .send-button {
                width: 72px;
                min-width: 72px;
                font-size: 10px;
                padding: 8px 3px;
            }

            .emoji-panel {
                width: 235px;
                max-width: calc(100vw - 14px);
                grid-template-columns: repeat(6, 1fr);
            }

            .emoji-item {
                font-size: 17px;
            }
        }

        @media (max-width: 400px) {

            .layout {
                grid-template-columns: 130px 1fr;
            }

            .sidebar {
                padding: 7px;
            }

            .brand h2 {
                font-size: 16px;
            }

            .account-name {
                max-width: 65px;
            }

            .chat-header {
                padding: 8px;
            }

            .send-button {
                width: 66px;
                min-width: 66px;
                font-size: 9px;
            }
        }

    </style>

</head>

<body>


<!-- =========================
     ЭКРАН ВХОДА
========================= -->

<div
    class="auth"
    id="authScreen"
>

    <div class="auth-logo">
        V
    </div>

    <h1>Vibe</h1>

    <p>
        Твой новый мессенджер
    </p>

    <input
        id="login"
        type="text"
        placeholder="Логин"
    >

    <input
        id="password"
        type="password"
        placeholder="Пароль"
    >

    <button
        class="main-button"
        onclick="loginAccount()"
    >
        Войти
    </button>

    <button
        class="register-button"
        onclick="window.location.href='register.html'"
    >
        Создать аккаунт
    </button>

</div>


<!-- =========================
     МЕССЕНДЖЕР
========================= -->

<div
    class="messenger"
    id="messenger"
>

    <div class="layout">


        <!-- =====================
             SIDEBAR
        ====================== -->

        <aside class="sidebar">

            <div class="sidebar-top">

                <div class="brand">

                    <div class="brand-icon">
                        V
                    </div>

                    <div>

                        <h2>
                            Vibe
                        </h2>

                        <div
                            class="account-name"
                            id="accountName"
                        >
                            @user
                        </div>

                    </div>

                </div>


                <button
                    class="profile-button"
                    onclick="openProfile()"
                >
                    👤
                </button>

            </div>


            <div class="search-box">

                <input
                    id="search"
                    type="text"
                    placeholder="Поиск людей..."
                    oninput="searchUsers()"
                >

            </div>


            <div
                class="search-results"
                id="searchResults"
            ></div>


            <div class="section-title">
                Мои чаты
            </div>


            <div
                class="friends-list"
                id="friendsList"
            ></div>


            <div class="sidebar-bottom">

                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    🚪 Выйти из аккаунта
                </button>

            </div>

        </aside>


        <!-- =====================
             CHAT
        ====================== -->

        <main class="chat">


            <div
                class="chat-header"
                id="chatHeader"
            >

                <div class="chat-user">

                    <div
                        class="avatar"
                        id="chatAvatar"
                    >
                        V
                    </div>

                    <div>

                        <div
                            class="chat-user-name"
                            id="chatTitle"
                        >
                            Выбери друга
                        </div>

                        <div
                            class="chat-user-status"
                            id="chatStatus"
                        >
                            Найди человека через поиск
                        </div>

                    </div>

                </div>

            </div>


            <div
                class="messages"
                id="messages"
            >

                <div class="empty-chat">

                    💬<br><br>

                    Найди пользователя,
                    добавь его в друзья
                    и начни общение.

                </div>

            </div>


            <!-- ПОЛЕ СООБЩЕНИЯ -->

            <div class="message-input">


                <div
                    class="emoji-panel"
                    id="emojiPanel"
                >

                    <button
                        class="emoji-item"
                        onclick="addEmoji('😀')"
                    >😀</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('😂')"
                    >😂</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('😍')"
                    >😍</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('😎')"
                    >😎</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('😭')"
                    >😭</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('😡')"
                    >😡</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('❤️')"
                    >❤️</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('🔥')"
                    >🔥</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('👍')"
                    >👍</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('👎')"
                    >👎</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('🎉')"
                    >🎉</button>

                    <button
                        class="emoji-item"
                        onclick="addEmoji('💀')"
                    >💀</button>

                </div>


                <button
                    class="emoji-button"
                    onclick="toggleEmojiPanel()"
                >
                    😊
                </button>


                <input
                    id="messageInput"
                    type="text"
                    placeholder="Сообщение..."
                    onkeydown="handleEnter(event)"
                >


                <button
                    class="send-button"
                    onclick="sendMessage()"
                >
                    Отправить
                </button>

            </div>

        </main>

    </div>

</div>


<!-- =========================
     ПРОФИЛЬ
========================= -->

<div
    class="modal"
    id="profileModal"
>

    <div class="modal-card">


        <div class="modal-top">

            <h2>
                Мой профиль
            </h2>

            <button
                class="close-button"
                onclick="closeProfile()"
            >
                ✕
            </button>

        </div>


        <div class="profile-preview">

            <div
                class="avatar"
                id="profileAvatar"
            >
                V
            </div>

            <div>

                <div
                    class="user-name"
                    id="profilePreviewName"
                >
                    Vibe
                </div>

                <div
                    class="profile-login"
                    id="profileLogin"
                >
                    @user
                </div>

            </div>

        </div>


        <div class="profile-form">


            <label>
                Фото профиля
            </label>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                style="display:none"
                onchange="handlePhoto(event)"
            >

            <label
                class="photo-label"
                for="photoInput"
            >
                📷 Выбрать фото
            </label>


            <label>
                Имя
            </label>

            <input
                id="profileName"
                type="text"
                maxlength="40"
                placeholder="Твоё имя"
            >


            <label>
                О себе
            </label>

            <textarea
                id="profileAbout"
                maxlength="200"
                placeholder="Расскажи немного о себе..."
            ></textarea>


            <label>
                Тема Vibe
            </label>

            <select id="themeSelect">

                <option value="dark">
                    🌙 Ночная
                </option>

                <option value="light">
                    ☀️ Светлая
                </option>

                <option value="purple">
                    💜 Фиолетовая
                </option>

                <option value="ocean">
                    🌊 Океан
                </option>

                <option value="sunset">
                    🌅 Закат
                </option>

            </select>


            <label>
                Стиль сообщений
            </label>

            <select id="messageStyle">

                <option value="classic">
                    Классический
                </option>

                <option value="square">
                    Квадратный
                </option>

                <option value="neon">
                    Неоновый
                </option>

            </select>


            <button
                class="save-profile"
                onclick="saveProfile()"
            >
                Сохранить изменения
            </button>

        </div>

    </div>

</div>


<script>

let currentUser = "";
let currentChat = "";
let friends = [];
let currentProfilePhoto = "";
let messageTimer = null;


// ============================
// ВСПОМОГАТЕЛЬНЫЕ
// ============================

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeJS(text) {

    return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");

}


function getInitial(name) {

    return (
        String(name || "V")
            .trim()
            .charAt(0)
            .toUpperCase()
    ) || "V";

}


// ============================
// ТЕМА
// ============================

function applyTheme(theme) {

    document.body.classList.remove(
        "theme-light",
        "theme-purple",
        "theme-ocean",
        "theme-sunset"
    );

    if (theme !== "dark") {

        document.body.classList.add(
            "theme-" + theme
        );

    }

    localStorage.setItem(
        "vibeTheme",
        theme
    );

}


function loadSavedTheme() {

    const theme =
        localStorage.getItem(
            "vibeTheme"
        ) || "dark";

    applyTheme(theme);

}


// ============================
// ВХОД
// ============================

async function loginAccount() {

    const login =
        document
            .getElementById("login")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value
            .trim();

    if (!login || !password) {

        alert(
            "Заполни логин и пароль!"
        );

        return;
    }

    try {

        const response =
            await fetch(
                "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        login,
                        password
                    })
                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        currentUser = login;

        localStorage.setItem(
            "vibeUser",
            currentUser
        );

        showMessenger();

    } catch {

        alert(
            "Не удалось подключиться к серверу"
        );

    }

}


// ============================
// МЕССЕНДЖЕР
// ============================

function showMessenger() {

    document
        .getElementById("authScreen")
        .style.display = "none";

    document
        .getElementById("messenger")
        .style.display = "block";

    document
        .getElementById("accountName")
        .textContent =
            "@" + currentUser;

    loadSavedTheme();

    loadFriends();

}


// ============================
// ДРУЗЬЯ
// ============================

async function loadFriends() {

    try {

        const response =
            await fetch(
                "/friends?login=" +
                encodeURIComponent(
                    currentUser
                )
            );

        friends =
            await response.json();

        renderFriends();

    } catch {

        console.log(
            "Ошибка загрузки друзей"
        );

    }

}


function renderFriends() {

    const list =
        document.getElementById(
            "friendsList"
        );

    list.innerHTML = "";

    if (friends.length === 0) {

        list.innerHTML = `
            <div class="empty-side">
                Пока нет друзей.<br><br>
                Найди человека через поиск.
            </div>
        `;

        return;
    }

    friends.forEach(user => {

        const div =
            document.createElement("div");

        div.className =
            "friend";

        if (
            user.login === currentChat
        ) {
            div.classList.add("active");
        }

        div.innerHTML = `

            ${
                user.photo

                ? `
                    <img
                        class="avatar"
                        src="${user.photo}"
                        alt=""
                    >
                `

                : `
                    <div class="avatar">
                        ${getInitial(
                            user.name ||
                            user.login
                        )}
                    </div>
                `
            }

            <div class="user-info">

                <div class="user-name">
                    ${escapeHTML(
                        user.name ||
                        user.login
                    )}
                </div>

                <div class="user-login">
                    @${escapeHTML(
                        user.login
                    )}
                </div>

            </div>
        `;

        div.onclick =
            () => openChat(user);

        list.appendChild(div);

    });

}


// ============================
// ПОИСК
// ============================

async function searchUsers() {

    const query =
        document
            .getElementById("search")
            .value
            .trim();

    const resultBox =
        document.getElementById(
            "searchResults"
        );

    resultBox.innerHTML = "";

    if (!query) {
        return;
    }

    try {

        const response =
            await fetch(
                "/users?current=" +
                encodeURIComponent(
                    currentUser
                ) +
                "&q=" +
                encodeURIComponent(query)
            );

        const users =
            await response.json();

        if (!users.length) {

            resultBox.innerHTML = `
                <div class="empty-side">
                    Никого не нашли
                </div>
            `;

            return;
        }

        users.forEach(user => {

            const div =
                document.createElement("div");

            div.className =
                "search-user";

            div.innerHTML = `

                ${
                    user.photo

                    ? `
                        <img
                            class="avatar"
                            src="${user.photo}"
                            alt=""
                        >
                    `

                    : `
                        <div class="avatar">
                            ${getInitial(
                                user.name ||
                                user.login
                            )}
                        </div>
                    `
                }

                <div class="user-info">

                    <div class="user-name">
                        ${escapeHTML(
                            user.name ||
                            user.login
                        )}
                    </div>

                    <div class="user-login">
                        @${escapeHTML(
                            user.login
                        )}
                    </div>

                </div>

                ${
                    user.isFriend

                    ? `
                        <button
                            class="remove-button"
                            onclick="
                                removeFriend(
                                    event,
                                    '${escapeJS(
                                        user.login
                                    )}'
                                )
                            "
                        >
                            Убрать
                        </button>
                    `

                    : `
                        <button
                            class="add-button"
                            onclick="
                                addFriend(
                                    event,
                                    '${escapeJS(
                                        user.login
                                    )}'
                                )
                            "
                        >
                            +
                        </button>
                    `
                }

            `;

            resultBox.appendChild(div);

        });

    } catch {

        resultBox.innerHTML = `
            <div class="empty-side">
                Ошибка поиска
            </div>
        `;

    }

}


// ============================
// ДОБАВЛЕНИЕ ДРУГА
// ============================

async function addFriend(
    event,
    login
) {

    event.stopPropagation();

    try {

        const response =
            await fetch(
                "/friends",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        from:
                            currentUser,

                        to:
                            login,

                        action:
                            "add"

                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        await loadFriends();

        await searchUsers();

    } catch {

        alert(
            "Не удалось добавить друга"
        );

    }

}


// ============================
// УДАЛЕНИЕ ДРУГА
// ============================

async function removeFriend(
    event,
    login
) {

    event.stopPropagation();

    try {

        const response =
            await fetch(
                "/friends",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        from:
                            currentUser,

                        to:
                            login,

                        action:
                            "remove"

                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(result.message);

            return;
        }

        if (
            currentChat === login
        ) {

            currentChat = "";

            document
                .getElementById(
                    "chatTitle"
                )
                .textContent =
                    "Выбери друга";

            document
                .getElementById(
                    "chatStatus"
                )
                .textContent =
                    "Найди человека через поиск";

            document
                .getElementById(
                    "messages"
                )
                .innerHTML = `
                    <div class="empty-chat">
                        💬<br><br>
                        Выбери друга,
                        чтобы начать общение.
                    </div>
                `;

            if (messageTimer) {
                clearInterval(
                    messageTimer
                );
            }

        }

        await loadFriends();

        await searchUsers();

    } catch {

        alert(
            "Ошибка удаления друга"
        );

    }

}


// ============================
// ОТКРЫТИЕ ЧАТА
// ============================

function openChat(user) {

    currentChat =
        user.login;

    document
        .getElementById(
            "chatTitle"
        )
        .textContent =
            user.name ||
            user.login;

    document
        .getElementById(
            "chatStatus"
        )
        .textContent =
            "@" + user.login;

    const avatar =
        document.getElementById(
            "chatAvatar"
        );

    if (user.photo) {

        avatar.outerHTML = `
            <img
                class="avatar"
                id="chatAvatar"
                src="${user.photo}"
                alt=""
            >
        `;

    } else {

        avatar.outerHTML = `
            <div
                class="avatar"
                id="chatAvatar"
            >
                ${getInitial(
                    user.name ||
                    user.login
                )}
            </div>
        `;

    }

    renderFriends();

    loadMessages();

    if (messageTimer) {
        clearInterval(
            messageTimer
        );
    }

    messageTimer =
        setInterval(
            loadMessages,
            1000
        );

}


// ============================
// СООБЩЕНИЯ
// ============================

async function loadMessages() {

    if (!currentChat) {
        return;
    }

    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser
                ) +
                "&user2=" +
                encodeURIComponent(
                    currentChat
                )
            );

        const messages =
            await response.json();

        const container =
            document.getElementById(
                "messages"
            );

        container.innerHTML = "";

        if (!messages.length) {

            container.innerHTML = `
                <div class="empty-chat">
                    💬<br><br>
                    Здесь пока нет сообщений.
                </div>
            `;

            return;
        }

        const messageStyle =
            localStorage.getItem(
                "vibeMessageStyle"
            ) || "classic";

        messages.forEach(message => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "message " +
                messageStyle;

            if (
                message.from ===
                currentUser
            ) {
                div.classList.add(
                    "mine"
                );
            }

            const time =
                new Date(
                    message.time
                );

            div.innerHTML = `
                ${escapeHTML(
                    message.text
                )}

                <div class="message-time">
                    ${time.toLocaleTimeString(
                        [],
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )}
                </div>
            `;

            container.appendChild(div);

        });

        container.scrollTop =
            container.scrollHeight;

    } catch {

        console.log(
            "Ошибка загрузки сообщений"
        );

    }

}


// ============================
// ОТПРАВКА
// ============================

async function sendMessage() {

    if (!currentChat) {

        alert(
            "Сначала добавь друга!"
        );

        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    try {

        const response =
            await fetch(
                "/send-message",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        from:
                            currentUser,

                        to:
                            currentChat,

                        text

                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(
                result.message
            );

            return;
        }

        input.value = "";

        loadMessages();

    } catch {

        alert(
            "Ошибка отправки сообщения"
        );

    }

}


// ============================
// ENTER
// ============================

function handleEnter(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


// ============================
// EMOJI
// ============================

function toggleEmojiPanel() {

    document
        .getElementById(
            "emojiPanel"
        )
        .classList.toggle(
            "show"
        );

}


function addEmoji(emoji) {

    const input =
        document.getElementById(
            "messageInput"
        );

    input.value += emoji;

    input.focus();

    document
        .getElementById(
            "emojiPanel"
        )
        .classList.remove(
            "show"
        );

}


// ============================
// ПРОФИЛЬ
// ============================

async function openProfile() {

    try {

        const response =
            await fetch(
                "/profile?login=" +
                encodeURIComponent(
                    currentUser
                )
            );

        const result =
            await response.json();

        if (!result.success) {

                result.message

        const user =

        document
            .getElementById(

            )

        document

                ) || "dark";

        currentProfilePhoto =

            );

        if (user.photo) {

                >
            `;

        } else {

            avatar.outerHTML = `

                >

                    )}
                </div>

        }

}

        )

        );

// ============================
// ФОТО
// ============================

function handlePhoto(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function() {

        const image =
            new Image();

        image.onload = function() {

            const canvas =
                document.createElement(
                    "canvas"
                );

            const maxSize = 500;

            let width =
                image.width;

            let height =
                image.height;

            if (
                width > maxSize ||
                height > maxSize
            ) {

                const scale =
                    Math.min(
                        maxSize / width,
                        maxSize / height
                    );

                width =
                    Math.round(
                        width * scale
                    );

                height =
                    Math.round(
                        height * scale
                    );

            }

            canvas.width =
                width;

            canvas.height =
                height;

            const ctx =
                canvas.getContext(
                    "2d"
                );

            ctx.drawImage(
                image,
                0,
                0,
                width,
                height
            );

            currentProfilePhoto =
                canvas.toDataURL(
                    "image/jpeg",
                    0.8
                );

            const avatar =
                document.getElementById(
                    "profileAvatar"
                );

            avatar.outerHTML = `
                <img
                    class="avatar"
                    id="profileAvatar"
                    src="${currentProfilePhoto}"
                    alt=""
                >
            `;

        };

        image.src =
            reader.result;

    };

    reader.readAsDataURL(file);

}


// ============================
// СОХРАНЕНИЕ ПРОФИЛЯ
// ============================

async function saveProfile() {

    const name =
        document
            .getElementById(
                "profileName"
            )
            .value
            .trim();

    const about =
        document
            .getElementById(
                "profileAbout"
            )
            .value
            .trim();

    const theme =
        document
            .getElementById(
                "themeSelect"
            )
            .value;

    const messageStyle =
        document
            .getElementById(
                "messageStyle"
            )
            .value;

    applyTheme(theme);

    localStorage.setItem(
        "vibeMessageStyle",
        messageStyle
    );

    try {

        const response =
            await fetch(
                "/profile",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        login:
                            currentUser,

                        name,
                        about,

                        photo:
                            currentProfilePhoto,

                        messageStyle

                    })

                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(
                result.message
            );

            return;
        }

        document
            .getElementById(
                "accountName"
            )
            .textContent =
                "@" + currentUser;

        closeProfile();

        await loadFriends();

        if (currentChat) {

            const friend =
                friends.find(
                    item =>
                        item.login ===
                        currentChat
                );

            if (friend) {

                document
                    .getElementById(
                        "chatTitle"
                    )
                    .textContent =
                        friend.name ||
                        friend.login;

            }

        }

        loadMessages();

        alert(
            "Профиль сохранён!"
        );

    } catch {

        alert(
            "Ошибка сохранения профиля"
        );

    }

}


// ============================
// ВЫХОД
// ============================

function logout() {

    if (
        messageTimer
    ) {
        clearInterval(
            messageTimer
        );
    }

    messageTimer = null;

    currentUser = "";
    currentChat = "";

    localStorage.removeItem(
        "vibeUser"
    );

    document
        .getElementById(
            "messenger"
        )
        .style.display =
            "none";

    document
        .getElementById(
            "authScreen"
        )
        .style.display =
            "block";

    document
        .getElementById(
            "login"
        )
        .value = "";

    document
        .getElementById(
            "password"
        )
        .value = "";

}


// ============================
// ЗАПУСК
// ============================

loadSavedTheme();

const savedUser =
    localStorage.getItem(
        "vibeUser"
    );

if (savedUser) {

    currentUser =
        savedUser;

    showMessenger();

}

</script>
