<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vibe</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
}

:root {
    --bg: #0b1020;
    --panel: #151b2f;
    --panel2: #202943;
    --text: #ffffff;
    --muted: #9aa5c1;
    --accent: #8b5cf6;
    --accent2: #6d28d9;
    --bubble: #293352;
    --border: rgba(255,255,255,0.08);
}

body.light {
    --bg: #eef2ff;
    --panel: #ffffff;
    --panel2: #f1f5f9;
    --text: #111827;
    --muted: #64748b;
    --accent: #6366f1;
    --accent2: #4f46e5;
    --bubble: #e2e8f0;
    --border: rgba(0,0,0,0.08);
}

body.ocean {
    --bg: #071923;
    --panel: #0d2835;
    --panel2: #123b4d;
    --text: #ffffff;
    --muted: #91b7c7;
    --accent: #06b6d4;
    --accent2: #0891b2;
    --bubble: #16465a;
    --border: rgba(255,255,255,0.08);
}

body.sunset {
    --bg: #24120f;
    --panel: #351a18;
    --panel2: #54231e;
    --text: #ffffff;
    --muted: #d5aaa3;
    --accent: #f97316;
    --accent2: #ea580c;
    --bubble: #633129;
    --border: rgba(255,255,255,0.08);
}


/* =========================================================
   COMMON
========================================================= */

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* =========================================================
   AUTH
========================================================= */

.auth {
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.logo {
    font-size: 38px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}

.auth input {
    width: 100%;
    margin-bottom: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.primary {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    color: white;
    background: var(--accent);
    font-weight: 700;
}

.primary:hover {
    background: var(--accent2);
}

.auth-message {
    min-height: 22px;
    margin-top: 12px;
    text-align: center;
    color: #f87171;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100dvh;
}

.layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
}

.side-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.brand {
    font-size: 26px;
    font-weight: 800;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.search {
    position: relative;
    margin-bottom: 10px;
}

.search input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.results {
    max-height: 190px;
    overflow-y: auto;
    margin-bottom: 8px;
}

.section-title {
    color: var(--muted);
    font-size: 13px;
    margin: 10px 5px;
}

.friends {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
}

.person {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 13px;
    cursor: pointer;
    background: transparent;
}

.person:hover,
.person.active {
    background: var(--panel2);
}

.avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-weight: 700;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.person-info {
    min-width: 0;
    flex: 1;
}

.person-name {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.person-login {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat-count {
    min-width: 26px;
    height: 26px;
    padding: 0 7px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: 700;
}

.bottom-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.bottom-buttons button {
    flex: 1;
    padding: 10px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}


/* =========================================================
   CHAT
========================================================= */

.chat {
    min-width: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
}

.chat-head {
    flex-shrink: 0;
    min-height: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.chat-user {
    min-width: 0;
    flex: 1;
}

.chat-name {
    font-weight: 800;
}

.chat-status {
    font-size: 12px;
    color: var(--muted);
}

.call-buttons {
    display: flex;
    gap: 7px;
}

.call-buttons button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.mobile-back-btn {
    display: none;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    font-size: 20px;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px;
    -webkit-overflow-scrolling: touch;
}

.empty-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
}

.message-row {
    display: flex;
    margin-bottom: 9px;
}

.message-row.mine {
    justify-content: flex-end;
}

.message {
    max-width: min(70%, 650px);
    padding: 10px 13px;
    border-radius: 15px;
    background: var(--bubble);
    word-break: break-word;
}

.message.mine {
    background: var(--accent);
    color: white;
}

.message-time {
    font-size: 10px;
    opacity: .65;
    margin-top: 4px;
    text-align: right;
}

.composer {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.composer input {
    min-width: 0;
    flex: 1;
    padding: 13px;
    border-radius: 13px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.composer button {
    width: 48px;
    border: 0;
    border-radius: 13px;
    background: var(--accent);
    color: white;
}


/* =========================================================
   MODALS
========================================================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.65);
}

.modal-card {
    width: 100%;
    max-width: 500px;
    max-height: 90dvh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
}

.modal-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
}

.modal input,
.modal textarea,
.modal select {
    width: 100%;
    margin-bottom: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.modal textarea {
    min-height: 100px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.modal-actions button {
    flex: 1;
    padding: 11px;
    border: 0;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
}

.modal-actions .primary {
    background: var(--accent);
}


/* =========================================================
   CHANNELS
========================================================= */

.channels-list {
    max-height: 55vh;
    overflow-y: auto;
}

.channel-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 7px;
    border-radius: 14px;
    background: var(--panel2);
    cursor: pointer;
}

.channel-item:hover {
    transform: translateY(-1px);
}

.channel-icon {
    width: 45px;
    height: 45px;
    min-width: 45px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    font-size: 20px;
}

.channel-info {
    min-width: 0;
    flex: 1;
}

.channel-name {
    font-weight: 800;
}

.channel-description {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.channel-view {
    display: flex;
    flex-direction: column;
    max-height: 75vh;
}

.channel-posts {
    flex: 1;
    min-height: 100px;
    max-height: 55vh;
    overflow-y: auto;
}

.channel-post {
    background: var(--panel2);
    border-radius: 15px;
    padding: 13px;
    margin-bottom: 10px;
}

.channel-post-text {
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 8px;
}

.channel-post img,
.channel-post video {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
}

.channel-post-time {
    color: var(--muted);
    font-size: 11px;
    margin-top: 7px;
}

.channel-owner-tools {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.channel-owner-tools input {
    flex: 1;
    min-width: 0;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-photo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--accent);
    overflow: hidden;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.profile-buttons button {
    flex: 1;
}


/* =========================================================
   CALL
========================================================= */

.call-screen {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(4,7,15,.96);
    display: flex;
    flex-direction: column;
}

.call-top {
    padding: 20px;
    text-align: center;
    color: white;
}

.call-name {
    font-size: 24px;
    font-weight: 800;
}

.call-video {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

#remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#localVideo {
    position: absolute;
    right: 15px;
    bottom: 15px;
    width: 150px;
    max-height: 220px;
    border-radius: 15px;
    object-fit: cover;
    background: #111;
}

.call-controls {
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

.call-controls button {
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 50%;
    background: var(--panel2);
    color: white;
}

.call-controls .end-call {
    background: #dc2626;
}

.incoming-buttons {
    display: flex;
    gap: 10px;
}

.incoming-buttons button {
    flex: 1;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 750px) {

    html,
    body {
        height: 100%;
        overflow: hidden;
    }

    .layout {
        position: relative;
        display: block;
        width: 100%;
        height: 100dvh;
    }

    .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100dvh;
        border-right: 0;
        padding:
            max(10px, env(safe-area-inset-top))
            10px
            max(8px, env(safe-area-inset-bottom))
            10px;
        z-index: 2;
    }

    .chat {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100dvh;
        display: none;
        z-index: 3;
    }

    .app.mobile-chat-open .sidebar {
        display: none;
    }

    .app.mobile-chat-open .chat {
        display: flex;
    }

    .side-top {
        justify-content: flex-start;
        margin-bottom: 12px;
    }

    .side-top .icon-btn {
        order: 1;
    }

    .side-top .brand {
        order: 2;
    }

    .search input {
        height: 48px;
        font-size: 16px;
    }

    .results {
        max-height: 180px;
    }

    .friends {
        display: block;
    }

    .person {
        min-height: 62px;
        margin-bottom: 4px;
    }

    .chat-head {
        min-height: 64px;
        padding:
            max(8px, env(safe-area-inset-top))
            9px
            8px
            9px;
    }

    .mobile-back-btn {
        display: block;
        flex-shrink: 0;
    }

    .chat-head .avatar {
        width: 40px;
        height: 40px;
        min-width: 40px;
    }

    .call-buttons button {
        width: 40px;
        height: 40px;
    }

    .messages {
        padding: 12px 10px;
    }

    .message {
        max-width: 84%;
    }

    .composer {
        padding:
            8px
            8px
            max(8px, env(safe-area-inset-bottom))
            8px;
    }

    .composer input {
        font-size: 16px;
    }

    .composer button {
        width: 46px;
        min-width: 46px;
    }

    .modal {
        padding: 10px;
    }

    .modal-card {
        max-height: 92dvh;
        border-radius: 18px;
        padding: 17px;
    }

    .channel-posts {
        max-height: 48vh;
    }

    #localVideo {
        width: 110px;
        max-height: 170px;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     AUTH
======================================================= -->

<div id="authScreen" class="auth">

    <div class="auth-card">

        <div class="logo">
            Vibe
        </div>

        <div class="subtitle">
            Твой новый мессенджер
        </div>

        <input
            id="loginInput"
            type="text"
            placeholder="Введите логин"
            autocomplete="username"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Войти
        </button>

        <button
            class="primary"
            style="margin-top:8px;"
            onclick="register()"
        >
            Создать аккаунт
        </button>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div
    id="app"
    class="app hidden"
>

    <div class="layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="side-top">

                <button
                    class="icon-btn"
                    onclick="openProfile()"
                    title="Профиль"
                >
                    👤
                </button>

                <div class="brand">
                    Vibe
                </div>

            </div>


            <!-- SEARCH -->

            <div class="search">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Поиск людей..."
                    oninput="searchUsers()"
                >

            </div>

            <div
                id="searchResults"
                class="results"
            ></div>


            <!-- CHATS -->

            <div class="section-title">
                Мои чаты
            </div>

            <div
                id="friends"
                class="friends"
            ></div>


            <div class="bottom-buttons">

                <button
                    onclick="openChannels()"
                >
                    📢 Каналы
                </button>

                <button
                    onclick="logout()"
                >
                    Выйти
                </button>

            </div>

        </aside>


        <!-- =================================================
             CHAT
        ================================================== -->

        <main class="chat">

            <div class="chat-head">

                <button
                    id="mobileBackButton"
                    class="mobile-back-btn"
                    onclick="closeMobileChat()"
                >
                    ←
                </button>


                <div
                    id="chatAvatar"
                    class="avatar"
                >
                    💬
                </div>


                <div class="chat-user">

                    <div
                        id="chatName"
                        class="chat-name"
                    >
                        Выберите чат
                    </div>

                    <div
                        id="chatStatus"
                        class="chat-status"
                    >
                        Vibe
                    </div>

                </div>


                <div class="call-buttons">

                    <button
                        onclick="startCall(false)"
                        title="Аудиозвонок"
                    >
                        📞
                    </button>

                    <button
                        onclick="startCall(true)"
                        title="Видеозвонок"
                    >
                        📹
                    </button>

                </div>

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty-chat">
                    Выберите человека,<br>
                    чтобы начать общение
                </div>

            </div>


            <div class="composer">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Написать сообщение..."
                    onkeydown="if(event.key==='Enter') sendMessage()"
                >

                <button
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </main>

    </div>

</div>


<!-- =======================================================
     PROFILE MODAL
======================================================= -->

<div
    id="profileModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div class="modal-title">
            Профиль
        </div>

        <div
            id="profilePreview"
            class="profile-photo"
        >
            👤
        </div>

        <input
            id="profileName"
            placeholder="Имя"
        >

        <textarea
            id="profileAbout"
            placeholder="О себе"
        ></textarea>

        <input
            id="profilePhoto"
            placeholder="Ссылка на фото или data:image..."
        >

        <select id="messageStyle">

            <option value="classic">
                Classic
            </option>

            <option value="square">
                Square
            </option>

            <option value="neon">
                Neon
            </option>

        </select>

        <div class="profile-buttons">

            <button
                class="primary"
                onclick="saveProfile()"
            >
                Сохранить
            </button>

            <button
                onclick="closeModal('profileModal')"
            >
                Закрыть
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     CHANNELS MODAL
======================================================= -->

<div
    id="channelsModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div class="modal-title">
            📢 Каналы
        </div>

        <button
            class="primary"
            onclick="openCreateChannel()"
        >
            + Создать канал
        </button>

        <div
            id="channelsList"
            class="channels-list"
            style="margin-top:14px;"
        ></div>

        <div class="modal-actions">

            <button
                onclick="closeModal('channelsModal')"
            >
                Закрыть
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     CREATE CHANNEL
======================================================= -->

<div
    id="createChannelModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div class="modal-title">
            Создать канал
        </div>

        <input
            id="channelNameInput"
            placeholder="Название канала"
        >

        <textarea
            id="channelDescriptionInput"
            placeholder="Описание канала"
        ></textarea>

        <div class="modal-actions">

            <button
                class="primary"
                onclick="createChannel()"
            >
                Создать
            </button>

            <button
                onclick="closeModal('createChannelModal')"
            >
                Отмена
            </button>

        </div>

    </div>

<script>

/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


let currentUser = null;
let currentChat = "";
let friends = [];
let chats = [];
let currentPhoto = "";
let currentChannel = null;

let socket = null;

let peerConnection = null;
let localStream = null;

let incomingCall = null;
let activeCallUser = "";
let activeCallVideo = false;

let microphoneEnabled = true;
let cameraEnabled = true;

let messageTimer = null;
let chatTimer = null;


/* =========================================================
   MOBILE
========================================================= */

function isMobileView() {
    return window.matchMedia(
        "(max-width: 750px)"
    ).matches;
}


function openMobileChatView() {

    if (!isMobileView()) {
        return;
    }

    $("app").classList.add(
        "mobile-chat-open"
    );
}


function closeMobileChat() {

    $("app").classList.remove(
        "mobile-chat-open"
    );

    if (chatTimer) {
        clearInterval(chatTimer);
        chatTimer = null;
    }
}


window.addEventListener(
    "resize",
    () => {

        if (!isMobileView()) {

            $("app").classList.remove(
                "mobile-chat-open"
            );
        }
    }
);


/* =========================================================
   AUTH
========================================================= */

async function login() {

    const loginValue =
        $("loginInput")
            .value
            .trim();

    const password =
        $("passwordInput")
            .value
            .trim();

    if (
        !loginValue ||
        !password
    ) {

        $("authMessage").textContent =
            "Заполни все поля";

        return;
    }

    try {

        const response =
            await fetch(
                "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            login:
                                loginValue,
                            password:
                                password
                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            $("authMessage").textContent =
                data.message;

            return;
        }

        currentUser =
            data.user;

        localStorage.setItem(
            "vibeLogin",
            currentUser.login
        );

        showApp();

    } catch (error) {

        $("authMessage").textContent =
            "Сервер не отвечает";
    }
}


async function register() {

    const loginValue =
        $("loginInput")
            .value
            .trim();

    const password =
        $("passwordInput")
            .value
            .trim();

    if (
        !loginValue ||
        !password
    ) {

        $("authMessage").textContent =
            "Заполни все поля";

        return;
    }

    try {

        const response =
            await fetch(
                "/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            login:
                                loginValue,
                            password:
                                password
                        })
                }
            );

        const data =
            await response.json();

        $("authMessage").textContent =
            data.message;

    } catch {

        $("authMessage").textContent =
            "Ошибка сервера";
    }
}


async function autoLogin() {

    const saved =
        localStorage.getItem(
            "vibeLogin"
        );

    if (!saved) {
        return;
    }

    $("loginInput").value =
        saved;
}


function showApp() {

    $("authScreen")
        .classList
        .add("hidden");

    $("app")
        .classList
        .remove("hidden");

    $("app")
        .classList
        .remove("mobile-chat-open");

    connectSocket();

    loadFriends();

    loadChats();

    loadChannels();
}


function logout() {

    localStorage.removeItem(
        "vibeLogin"
    );

    if (socket) {
        try {
            socket.close();
        } catch {}
    }

    currentUser = null;
    currentChat = "";

    $("app")
        .classList
        .add("hidden");

    $("authScreen")
        .classList
        .remove("hidden");
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket() {

    try {

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";

        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host
            );

        socket.onopen =
            () => {

                socket.send(
                    JSON.stringify({
                        type:
                            "auth",

                        login:
                            currentUser.login
                    })
                );
            };

        socket.onmessage =
            event => {

                try {

                    const data =
                        JSON.parse(
                            event.data
                        );

                    handleSocketMessage(
                        data
                    );

                } catch {}
            };

        socket.onclose =
            () => {

                setTimeout(
                    () => {

                        if (
                            currentUser &&
                            !socket
                        ) {
                            connectSocket();
                        }

                    },
                    3000
                );
            };

    } catch {}
}


function sendSocket(data) {

    if (
        socket &&
        socket.readyState === 1
    ) {

        socket.send(
            JSON.stringify(data)
        );
    }
}


function handleSocketMessage(data) {

    if (
        data.type ===
        "incoming-call"
    ) {

        incomingCall = data;

        $("incomingCallText")
            .textContent =
            (
                data.name ||
                data.from
            ) +
            " звонит вам";

        $("incomingCallModal")
            .classList
            .remove("hidden");

        return;
    }


    if (
        data.type ===
        "answer"
    ) {

        handleAnswer(
            data.answer
        );

        return;
    }


    if (
        data.type ===
        "ice-candidate"
    ) {

        if (
            peerConnection &&
            data.candidate
        ) {

            peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                )
                .catch(() => {});
        }

        return;
    }


    if (
        data.type ===
        "call-rejected"
    ) {

        alert(
            data.reason ||
            "Звонок отклонён"
        );

        endCallUI();

        return;
    }


    if (
        data.type ===
        "hangup"
    ) {

        endCallUI();

        return;
    }
}


/* =========================================================
   SEARCH
========================================================= */

async function searchUsers() {

    const query =
        $("searchInput")
            .value
            .trim();

    const box =
        $("searchResults");

    if (!query) {

        box.innerHTML = "";

        return;
    }

    try {

        const response =
            await fetch(
                "/users?current=" +
                encodeURIComponent(
                    currentUser.login
                ) +
                "&q=" +
                encodeURIComponent(
                    query
                )
            );

        const users =
            await response.json();

        box.innerHTML = "";

        users.forEach(
            user => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "person";

                item.innerHTML =
                    personHTML(
                        user
                    );

                item.onclick =
                    () => {

                        openChat(
                            user.login
                        );
                    };

                box.appendChild(item);
            }
        );

    } catch {}
}


/* =========================================================
   FRIENDS + CHATS
========================================================= */

function personHTML(user, count = 0) {

    const avatar =
        user.photo
            ? `<img src="${escapeHTML(user.photo)}">`
            : "👤";

    return `
        <div class="avatar">
            ${avatar}
        </div>

        <div class="person-info">

            <div class="person-name">
                ${escapeHTML(
                    user.name ||
                    user.login
                )}
            </div>

            <div class="person-login">
                @${escapeHTML(
                    user.login
                )}
            </div>

        </div>

        ${
            count > 0
                ? `
                    <div class="chat-count">
                        ${count}
                    </div>
                  `
                : ""
        }
    `;
}


async function loadFriends() {

    try {

        const response =
            await fetch(
                "/friends?login=" +
                encodeURIComponent(
                    currentUser.login
                )
            );

        friends =
            await response.json();

        renderFriends();

    } catch {}
}


async function loadChats() {

    try {

        const response =
            await fetch(
                "/chats?login=" +
                encodeURIComponent(
                    currentUser.login
                )
            );

        chats =
            await response.json();

        renderChats();

    } catch {}
}


function renderChats() {

    const box =
        $("friends");

    box.innerHTML = "";

    if (!chats.length) {

        box.innerHTML =
            `
            <div
                style="
                    color:var(--muted);
                    padding:15px;
                    text-align:center;
                "
            >
                Пока нет чатов
            </div>
            `;

        return;
    }

    chats.forEach(
        chat => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "person";

            if (
                chat.login ===
                currentChat
            ) {
                item.classList.add(
                    "active"
                );
            }

            item.innerHTML =
                personHTML(
                    chat.user,
                    chat.messageCount
                );

            item.onclick =
                () => {

                    openChat(
                        chat.login
                    );
                };

            box.appendChild(item);
        }
    );
}


function renderFriends() {

    /*
        Если есть чаты — показываем именно
        историю чатов.

        Люди без переписки остаются доступными
        через поиск.
    */

    if (chats.length) {
        renderChats();
        return;
    }

    const box =
        $("friends");

    box.innerHTML = "";

    friends.forEach(
        user => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "person";

            item.innerHTML =
                personHTML(
                    user
                );

            item.onclick =
                () => {

                    openChat(
                        user.login
                    );
                };

            box.appendChild(item);
        }
    );
}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(login) {

    currentChat =
        login;

    openMobileChatView();

    if (chatTimer) {
        clearInterval(chatTimer);
    }

    const user =
        await getUser(
            login
        );

    if (user) {

        $("chatName")
            .textContent =
            user.name ||
            user.login;

        $("chatStatus")
            .textContent =
            "@" +
            user.login;

        const avatar =
            $("chatAvatar");

        avatar.innerHTML =
            user.photo
                ? `<img src="${escapeHTML(user.photo)}">`
                : "👤";
    }

    await loadMessages(
        true
    );

    chatTimer =
        setInterval(
            () => {

                if (
                    currentChat
                ) {

                    loadMessages(
                        false
                    );

                    loadChats();
                }

            },
            1500
        );

    renderChats();
}


/* =========================================================
   GET USER
========================================================= */

async function getUser(login) {

    try {

        const response =
            await fetch(
                "/profile?login=" +
                encodeURIComponent(
                    login
                )
            );

        const data =
            await response.json();

        if (
            data.success
        ) {
            return data.user;
        }

    } catch {}

    return null;
}


/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages(
    forceScroll = false
) {

    if (!currentChat) {
        return;
    }

    const box =
        $("messages");

    const wasNearBottom =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        100;

    try {

        const response =
            await fetch(
                "/messages?user1=" +
                encodeURIComponent(
                    currentUser.login
                ) +
                "&user2=" +
                encodeURIComponent(
                    currentChat
                )
            );

        const messages =
            await response.json();

        box.innerHTML = "";

        if (!messages.length) {

            box.innerHTML =
                `
                <div class="empty-chat">
                    Пока сообщений нет.<br>
                    Напишите первым!
                </div>
                `;

            return;
        }

        messages.forEach(
            message => {

                const row =
                    document.createElement(
                        "div"
                    );

                const mine =
                    message.from ===
                    currentUser.login;

                row.className =
                    "message-row" +
                    (
                        mine
                            ? " mine"
                            : ""
                    );

                const bubble =
                    document.createElement(
                        "div"
                    );

                bubble.className =
                    "message" +
                    (
                        mine
                            ? " mine"
                            : ""
                    );

                const time =
                    new Date(
                        message.time
                    )
                        .toLocaleTimeString(
                            [],
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );

                bubble.innerHTML =
                    `
                    <div>
                        ${escapeHTML(
                            message.text
                        )}
                    </div>

                    <div class="message-time">
                        ${time}
                    </div>
                    `;

                row.appendChild(
                    bubble
                );

                box.appendChild(
                    row
                );
            }
        );

        if (
            forceScroll ||
            wasNearBottom
        ) {

            box.scrollTop =
                box.scrollHeight;
        }

    } catch {}
}


async function sendMessage() {

    const input =
        $("messageInput");

    const text =
        input.value.trim();

    if (
        !text ||
        !currentChat
    ) {
        return;
    }

    input.value = "";

    try {

        const response =
            await fetch(
                "/send-message",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            from:
                                currentUser.login,

                            to:
                                currentChat,

                            text

                        })
                }
            );

        const data =
            await response.json();

        if (
            data.success
        ) {

            await loadMessages(
                true
            );

            await loadChats();
        }

    } catch {}
}


/* =========================================================
   PROFILE
========================================================= */

async function openProfile() {

    const user =
        await getUser(
            currentUser.login
        );

    if (!user) {
        return;
    }

    $("profileName").value =
        user.name || "";

    $("profileAbout").value =
        user.about || "";

    $("profilePhoto").value =
        user.photo || "";

    $("messageStyle").value =
        user.messageStyle ||
        "classic";

    currentPhoto =
        user.photo || "";

    updateProfilePreview();

    $("profileModal")
        .classList
        .remove("hidden");
}


function updateProfilePreview() {

    const box =
        $("profilePreview");

    if (currentPhoto) {

        box.innerHTML =
            `
            <img
                src="${escapeHTML(
                    currentPhoto
                )}"
            >
            `;

    } else {

        box.innerHTML =
            "👤";
    }
}


$("profilePhoto")
    .addEventListener(
        "input",
        event => {

            currentPhoto =
                event.target.value;

            updateProfilePreview();
        }
    );


async function saveProfile() {

    try {

        const response =
            await fetch(
                "/profile",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            login:
                                currentUser.login,

                            name:
                                $("profileName")
                                    .value,

                            about:
                                $("profileAbout")
                                    .value,

                            photo:
                                $("profilePhoto")
                                    .value,

                            messageStyle:
                                $("messageStyle")
                                    .value

                        })
                }
            );

        const data =
            await response.json();

        if (
            data.success
        ) {

            currentUser =
                data.user;

            closeModal(
                "profileModal"
            );

            loadChats();
            loadFriends();

            if (
                currentChat
            ) {
                openChat(
                    currentChat
                );
            }
        }

    } catch {}
}


/* =========================================================
   CHANNELS
========================================================= */

async function openChannels() {

    $("channelsModal")
        .classList
        .remove("hidden");

    await loadChannels();
}


async function loadChannels() {

    try {

        const response =
            await fetch(
                "/channels"
            );

        const channels =
            await response.json();

        const box =
            $("channelsList");

        box.innerHTML = "";

        if (!channels.length) {

            box.innerHTML =

                <div
                    style="
                        color:var(--muted);
                        padding:15px;
                        text-align:center;
                    "
                >
                    Пока каналов нет
                </div>
                `;

            return;
        }

        channels.forEach(
            channel => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "channel-item";

                item.innerHTML =
                    `
                    <div class="channel-icon">
                        📢
                    </div>

                    <div class="channel-info">

                        <div class="channel-name">
                            ${escapeHTML(
                                channel.name
                            )}
                        </div>

                        <div class="channel-description">
                            ${escapeHTML(
                                channel.description ||
                                "Канал Vibe"
                            )}
                        </div>

                    </div>

                    <div class="chat-count">
                        ${channel.postCount || 0}
                    </div>
                    `;

                item.onclick =
                    () => {

                        openChannel(
                            channel
                        );
                    };

                box.appendChild(
                    item
                );

function openCreateChannel() {

    $("channelNameInput")
        .value = "";

    $("channelDescriptionInput")
        .value = "";

    $("createChannelModal")
        .classList
        .remove("hidden");
}


async function createChannel() {

    const name =
        $("channelNameInput")
            .value
            .trim();

    const description =
        $("channelDescriptionInput")
            .value
            .trim();

    if (!name) {

        alert(
            "Введите название канала"
        );

        return;
    }

    try {

        const response =
            await fetch(
                "/channels",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            owner:
                                currentUser.login,

                            name,

                            description

                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                data.message
            );

            return;
        }

        closeModal(
            "createChannelModal"
        );

        await loadChannels();

    } catch {

        alert(
            "Ошибка создания канала"
        );
    }
}


async function openChannel(channel) {

    currentChannel =
        channel;

    $("channelTitle")
        .textContent =
        "📢 " +
        channel.name;

    $("channelModal")
        .classList
        .remove("hidden");

    if (
        channel.owner ===
        currentUser.login
    ) {

        $("channelOwnerTools")
            .classList
            .remove("hidden");

    } else {

        $("channelOwnerTools")
            .classList
            .add("hidden");
    }

    await loadChannelPosts();
}


async function loadChannelPosts() {

    if (!currentChannel) {
        return;
    }

    try {

        const response =
            await fetch(
                "/channel-posts?channelId=" +
                encodeURIComponent(
                    currentChannel.id
                )
            );

        const posts =
            await response.json();

        const box =
            $("channelPosts");

        box.innerHTML = "";

        if (!posts.length) {

            box.innerHTML =
                `
                <div
                    style="
                        color:var(--muted);
                        text-align:center;
                        padding:20px;
                    "
                >
                    В канале пока нет публикаций
                </div>
                `;

            return;
        }

        posts.forEach(
            post => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "channel-post";

                let mediaHTML = "";

                if (
                    post.media
                ) {

                    if (
                        post.mediaType
                            .startsWith(
                                "image"
                            )
                    ) {

                        mediaHTML =
                            `
                            <img
                                src="${escapeHTML(
                                    post.media
                                )}"
                            >
                            `;

                    } else if (
                        post.mediaType
                            .startsWith(
                                "video"
                            )
                    ) {

                        mediaHTML =
                            `
                            <video
                                src="${escapeHTML(
                                    post.media
                                )}"
                                controls
                                playsinline
                            ></video>
                            `;
                    }
                }

                item.innerHTML =
                    `
                    ${
                        post.text
                            ? `
                                <div class="channel-post-text">
                                    ${escapeHTML(
                                        post.text
                                    )}
                                </div>
                              `
                            : ""
                    }

                    ${mediaHTML}

                    <div class="channel-post-time">
                        ${new Date(
                            post.time
                        ).toLocaleString()}
                    </div>
                    `;

                box.appendChild(
                    item
                );
            }
        );

        box.scrollTop =
            box.scrollHeight;

    } catch {}
}


async function publishChannelPost() {

    if (!currentChannel) {
        return;
    }

    const text =
        $("channelPostInput")
            .value
            .trim();

    const file =
        $("channelMediaInput")
            .files[0];

    if (
        !text &&
        !file
    ) {

        alert(
            "Добавь текст, фото или видео"
        );

        return;
    }

    let media = null;
    let mediaType = "";

    if (file) {

        if (
            !file.type.startsWith(
                "image/"
            ) &&
            !file.type.startsWith(
                "video/"
            )
        ) {

            alert(
                "Можно загружать только фото или видео"
            );

            return;
        }

        /*
            Ограничиваем размер одного
            файла примерно 20 MB.
        */

        if (
            file.size >
            20 * 1024 * 1024
        ) {

            alert(
                "Файл слишком большой. Максимум 20 MB."
            );

            return;
        }

        media =
            await fileToDataURL(
                file
            );

        mediaType =
            file.type;
    }

    try {

        const response =
            await fetch(
                "/channel-post",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            channelId:
                                currentChannel.id,

                            author:
                                currentUser.login,

                            text,

                            media,

                            mediaType

                        })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                data.message
            );

            return;
        }

        $("channelPostInput")
            .value = "";

        $("channelMediaInput")
            .value = "";

        await loadChannelPosts();

        await loadChannels();

    } catch {

        alert(
            "Ошибка публикации"
        );
    }
}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* =========================================================
   CALLS
========================================================= */

const rtcConfig = {

    iceServers: [
        {
            urls:
                "stun:stun.l.google.com:19302"
        }
    ]
};


async function startCall(video) {

    if (!currentChat) {

        alert(
            "Сначала откройте чат"
        );

        return;
    }

    activeCallUser =
        currentChat;

    activeCallVideo =
        video;

    try {

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: true,

                    video: video
                        ? true
                        : false
                });

        peerConnection =
            createPeerConnection();

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );

        const offer =
            await peerConnection
                .createOffer();

        await peerConnection
            .setLocalDescription(
                offer
            );

        sendSocket({

            type:
                "call",

            to:
                activeCallUser,

            video,

            offer:
                peerConnection
                    .localDescription,

            name:
                currentUser.name ||
                currentUser.login,

            photo:
                currentUser.photo ||
                ""
        });

        showCallUI();

    } catch (error) {

        console.error(error);

        alert(
            "Не удалось начать звонок"
        );
    }
}


function createPeerConnection() {

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                sendSocket({

                    type:
                        "ice-candidate",

                    to:
                        activeCallUser,

                    candidate:
                        event.candidate
                });
            }
        };

    pc.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {

                $("remoteVideo")
                    .srcObject =
                    event.streams[0];
            }
        };

    return pc;
}


function showCallUI() {

    $("callName")
        .textContent =
        activeCallUser;

    $("callScreen")
        .classList
        .remove("hidden");

    if (localStream) {

        $("localVideo")
            .srcObject =
            localStream;
    }

    $("localVideo")
        .style
        .display =
        activeCallVideo
            ? "block"
            : "none";
}


async function acceptIncomingCall() {

    if (!incomingCall) {
        return;
    }

    activeCallUser =
        incomingCall.from;

    activeCallVideo =
        !!incomingCall.video;

    try {

        closeModal(
            "incomingCallModal"
        );

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: true,

                    video:
                        activeCallVideo
                });

        peerConnection =
            createPeerConnection();

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingCall.offer
                )
            );

        const answer =
            await peerConnection
                .createAnswer();

        await peerConnection
            .setLocalDescription(
                answer
            );

        sendSocket({

            type:
                "answer",

            to:
                activeCallUser,

            answer:
                peerConnection
                    .localDescription
        });

        showCallUI();

        incomingCall = null;

    } catch (error) {

        console.error(error);

        alert(
            "Не удалось принять звонок"
        );
    }
}


function rejectIncomingCall() {

    if (!incomingCall) {
        return;
    }

    sendSocket({

        type:
            "reject-call",

        to:
            incomingCall.from
    });

    incomingCall =
        null;

    closeModal(
        "incomingCallModal"
    );
}


async function handleAnswer(answer) {

    if (
        !peerConnection
    ) {
        return;
    }

    try {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );

    } catch {}
}


function toggleMicrophone() {

    if (!localStream) {
        return;
    }

    const tracks =
        localStream
            .getAudioTracks();

    tracks.forEach(
        track => {

            track.enabled =
                !track.enabled;

            microphoneEnabled =
                track.enabled;
        }
    );

    $("micButton")
        .textContent =
        microphoneEnabled
            ? "🎙️"
            : "🔇";
}


function toggleCamera() {

    if (!localStream) {
        return;
    }

    const tracks =
        localStream
            .getVideoTracks();

    tracks.forEach(
        track => {

            track.enabled =
                !track.enabled;

            cameraEnabled =
                track.enabled;
        }
    );

    $("cameraButton")
        .textContent =
        cameraEnabled
            ? "📷"
            : "🚫";
}


function hangupCall() {

    if (
        activeCallUser
    ) {

        sendSocket({

            type:
                "hangup",

            to:
                activeCallUser
        });
    }

    endCallUI();
}


function endCallUI() {

    if (
        localStream
    ) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;
    }

    if (
        peerConnection
    ) {

        try {
            peerConnection.close();
        } catch {}

        peerConnection =
            null;
    }

    $("remoteVideo")
        .srcObject =
        null;

    $("localVideo")
        .srcObject =
        null;

    $("callScreen")
        .classList
        .add("hidden");

    activeCallUser = "";
    incomingCall = null;
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id) {

    $(id)
        .classList
        .add("hidden");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}
